spring:

  application:
    name: antiyoyo

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:myuser}
    password: ${RABBITMQ_PASSWORD:secret}

  data:
    mongodb:
      uuid-representation: standard
      host: ${MONGO_HOST:localhost}
      authentication-database: admin
      database: ww-game
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:secret}


management:
  endpoint:
    health:
      show-details: always  # Подробный вывод здоровья
    shutdown:
      enabled: true         # Разрешить graceful shutdown (POST /actuator/shutdown)
  endpoints:
    web:
      exposure:
        include: "*"        # Открыть все эндпоинты
      base-path: /actuator  # Базовый путь (по умолчанию /actuator)

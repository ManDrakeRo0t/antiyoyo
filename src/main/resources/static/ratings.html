<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Ratings</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <link rel="stylesheet" href="main.css">
    <style>
        .table-item-value-align-center {
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            will-change: transform;
            cursor: pointer;
        }
        .top-1 {
            background: linear-gradient(
                90deg,
                #ef5dff,
                #d500d5,
                #FF1493,
                #ff4400,
                #fec5af,
                #ff4400,
                #FF1493,
                #d500d5,
                #ef5dff,

                #d500d5,
                #FF1493,
                #ff4400,
                #fec5af,
                #ff4400,
                #FF1493,
                #d500d5,
                #ef5dff 
            );
            background-size: 1600% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: animate 80s linear infinite;
        }
        .top-2 {
            background: linear-gradient(
                90deg,
                #9370DB,
                #a094e4,
                #87CEFA,
                #00BFFF,
                #E6E6FA,
                #00BFFF,
                #87CEFA,
                #a094e4,
                #9370DB,

                #a094e4,
                #87CEFA,
                #00BFFF,
                #E6E6FA,
                #00BFFF,
                #87CEFA,
                #a094e4,
                #9370DB
            );
            background-size: 1600% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: animate 80s linear infinite;
        }
        .top-3 {
            background: linear-gradient(
                90deg,
                #ad5d0c,
                #D2691E,
                #FF8C00,
                #FFA500,
                #FFE4B5,
                #FFA500,
                #FF8C00,
                #D2691E,
                #ad5d0c,
                
                #D2691E,
                #FF8C00,
                #FFA500,
                #FFE4B5,
                #FFA500,
                #FF8C00,
                #D2691E,
                #ad5d0c
            );
            background-size: 1600% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: animate 80s linear infinite;
        }
        @keyframes animate {
            from {
                background-position: 0% 50%;
            }
            to {
                background-position: -800% 50%;
            }
        }
        .table-item-value-align-center:hover, .table-item-value-align-center:focus {
            transform: scale(1.16);
        }
        .table-item-value-align-center:active {
            transform: scale(0.94);
        }
        .icon {
            height: 1.5em;
            vertical-align: middle;
        }
        .skeleton {
            background: linear-gradient(90deg, #ececec 25%, #f5e7c6 50%, #ececec 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.2s infinite linear;
            border-radius: 8px;
            min-height: 32px;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton.table-item {
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0d0a0;
        }
        .skeleton .table-item-value-align-left,
        .skeleton .table-item-value-align-center,
        .skeleton .table-item-value-align-right {
            height: 32px;
            border-radius: 8px;
            background: none;
        }
        .skeleton .table-item-value-align-left { width: 60px; background: #ececec; }
        .skeleton .table-item-value-align-center { width: 180px; background: #ececec; }
        .skeleton .table-item-value-align-right { width: 80px; background: #ececec; }
         @media (min-width: 390px)  { 
            .logo { width: 180px; margin-top: 10px; margin-bottom: 10px; }
            .title { font-size: 50px; }

            .container { max-width: 340px; height: 390px; margin-bottom: 12px; margin-top: 12px; padding: 12px 24px; }

            .container-header-text { font-size: 24px; }
            .table-item-text-value { font-size: 28px; }

            .svg-btn { width: 240px; height: 60px;}
            .svg-btn-text { font-size: 35px; }
        }
        @media (min-width: 600px) {
            .logo { width: 190px; margin-top: 5px; margin-bottom: 5px; }
            .title { font-size: 60px; }
            
            .container { max-width: 500px; height: 390px; margin-bottom: 20px; margin-top: 6px; padding: 12px 24px; }
    
            .container-header-text { font-size: 30px; }
            .table-item-text-value { font-size: 34px; }      

            .svg-btn { width: 280px; height: 67px; }
            .svg-btn-text { font-size: 40px; }
        }
        @media (min-width: 2560px) {
            .logo { width: 320px; margin-top: 50px; margin-bottom: 20px; }
            .title { font-size: 100px; }

            .container { max-width: 600px; height: 700px; margin-bottom: 30px; margin-top: 10px; padding: 12px 24px; }
            
            .container-header-text { font-size: 32px; }
            .table-item-text-value { font-size: 36px; }
            
            .svg-btn { width: 360px; height: 90px; }
            .svg-btn-text { font-size: 50px; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">Ratings</div>
    <div class="container">
        
        <div class="container-headers">
            <div class="container-header-text container-headers-col-text-left">Rank</div>
            <div class="container-header-text container-headers-col-text-center">Name</div>
            <div class="container-header-text container-headers-col-text-right">Rating</div>
        </div>
        <div class="container-into-container">
            <!-- skeleton loader -->
        </div>
    </div>
    <div class="svg-btn" onclick="window.location.href='index.html'">
        <img src="ui-elements/svg/red_button.svg" alt="BACK" style="width:100%;height:100%;">
        <span class="svg-btn-text">BACK</span>
    </div>
    <script src="auth.js" ></script>
    <script src="common.js" ></script>
    <script>
    function showSkeletonLoader(gamesList, count = 7) {
        gamesList.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'table-item skeleton';

            const placeDiv = document.createElement('div');
            placeDiv.className = 'table-item-value-align-left skeleton';
            itemDiv.appendChild(placeDiv);

            const userNameDiv = document.createElement('div');
            userNameDiv.className = 'table-item-value-align-center skeleton';
            itemDiv.appendChild(userNameDiv);

            const scoreDiv = document.createElement('div');
            scoreDiv.className = 'table-item-value-align-right skeleton';
            itemDiv.appendChild(scoreDiv);

            gamesList.appendChild(itemDiv);
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        const gamesList = document.querySelector('.container-into-container');
        if (!gamesList || typeof getBackendUrl !== 'function') return;
        // Показываем скелетон-лоадер
        showSkeletonLoader(gamesList, 5);
        try {
            const response = await fetch(getBackendUrl() + '/api/users/top-rating');
            
            if (!response.ok) throw new Error('Network response was not ok');
            const users = await response.json();
            gamesList.innerHTML = '';
            users.forEach((user, idx) => {
                const placeDiv = document.createElement('div');
                placeDiv.className = 'table-item-text-value table-item-value-align-left';
                if (idx === 0) {
                    placeDiv.innerHTML = '<img src="ui-elements/top_1.png" class="icon">';
                } else if (idx === 1) {
                    placeDiv.innerHTML = '<img src="ui-elements/top_2.png" class="icon">';
                } else if (idx === 2) {
                    placeDiv.innerHTML = '<img src="ui-elements/top_3.png" class="icon">';
                } else {
                    placeDiv.textContent = `#${idx + 1}`;
                }

                const userNameDiv = document.createElement('div');
                userNameDiv.className = 'table-item-text-value table-item-value-align-center';
                // gradient
                if (idx === 0) {
                userNameDiv.classList.add('top-1');
                } else if (idx === 1) {
                userNameDiv.classList.add('top-2');
                } else if (idx === 2) {
                userNameDiv.classList.add('top-3');
                }
                userNameDiv.innerHTML = `<div>${user.login}</div>`;

                const scoreDiv = document.createElement('div');
                scoreDiv.className = 'table-item-text-value table-item-value-align-right';
                scoreDiv.textContent = user.rating;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'table-item';
                itemDiv.appendChild(placeDiv);
                itemDiv.appendChild(userNameDiv);
                itemDiv.appendChild(scoreDiv);

                gamesList.appendChild(itemDiv);
            });
        } catch (e) {
            gamesList.innerHTML = '<div style="text-align:center;color:#b23c1a;">Failed to load ratings</div>';
        }
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Connect</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <style>
        @font-face {
            font-family: 'Castlefire';
            src: url('fonts/Castlefire.ttf') format('truetype'),
                 url('fonts/Castlefire.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: rusty_typewriter;
                 src: url('fonts/rusty_typewriter.ttf') format('truetype'),
                 url('fonts/rusty_typewriter.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        html {
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100%;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #f0cba3;
            font-family: 'Castlefire';
            user-select: none;
        }
        .logo {
            width: 180px;
            height: auto;
            margin-top: 40px;
            margin-bottom: 20px;
            display: block;
            pointer-events: none;
            user-select: none;
        }
        .title {
            font-family: 'Castlefire';
            font-size: 64px;
            color: #222;
            text-align: center;
            margin: 0;
            line-height: 1;
            user-select: none;
        }
        .greeting {
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            text-align: center;
            margin: 16px 0 32px 0;
            line-height: 1;
            user-select: none;
        }
        .form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-bottom: 40px;
        }
        .input-wrapper {
            position: relative;
            width: 600px;
            height: 100px;
            margin-bottom: 8px;
        }
        .input-bg {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0; top: 0;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }
        .input-field {
            position: absolute;
            left: 0; top: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Castlefire';
            font-size: 44px;
            color: #222;
            padding: 0 40px;
            z-index: 2;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .input-field::placeholder {
            color: #a1966d;
            opacity: 1;
        }
        .buttons {
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .svg-btn {
            width: 320px;
            height: 90px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
            transform-origin: center center;
            will-change: transform;
        }
        .svg-btn:hover, .svg-btn:focus {
            transform: scale(1.06);
            box-shadow: none;
            z-index: 2;
        }
        .svg-btn:active {
            transform: scale(0.92);
            transition: transform 0.1s ease-out;
        }
        .svg-btn-text {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Castlefire';
            font-size: 44px;
            color: #222;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
            transform: none !important;
        }
        .games-container {
            width: 100%;
            max-width: 560px;
            background: #fff8dceb;
            border-radius: 24px;
            padding: 6px 24px;
            line-height: 1;
            position: relative;
            margin: 0 auto;
            box-sizing: border-box;
            box-shadow: 0 2px 16px 0 rgba(0,0,0,0.07);
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .games-title {
            text-align: center;
            font-family: 'Castlefire';
            font-size: 36px;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
            margin: 18px 0 12px 0;
        }
        .games-list {
            flex: 1 1 auto;
            overflow-y: auto;
            min-height: 0;
        }
        .games-container::-webkit-scrollbar,
        .games-list::-webkit-scrollbar {
            display: none;
        }
        .game-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 0 18px 0;
            border-bottom: 1px solid #e0d0a0;
        }
        .game-item:last-child {
            border-bottom: none;
        }
        .games-headers {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0d0a0;
            padding: 0 8px 8px 8px;
        }
        .header-icon {
            height: 48px;
            vertical-align: middle;
        }
        .games-headers-col {
            flex: 1;
            display: flex;
            align-items: center;
        }
        .games-headers-col-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .games-headers-col-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            text-align: right;
        }
        .svg-btn-in-conatiner {
            height:60px;
            transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            background:none;
            border:none;
        }
        .svg-btn-in-conatiner:hover, .svg-btn-in-conatiner:focus {
            transform: scale(1.06);
            box-shadow: none;
            z-index: 2;
        }
        .svg-btn-in-conatiner:active {
            transform: scale(0.92);
            transition: transform 0.1s ease-out;
        }
        .svg-btn-text-in-conatiner {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
            transform: none !important;
        }

        /*То что ниже не адаптировано!!!!*/
        .session-row {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 0;
        }
        .session-col-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .session-col-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            text-align: center;
        }
        .session-col-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .session-time, .session-players {
            font-family: rusty_typewriter;
            font-size: 28px;
            color: #222;
        }
        .session-settings-icon {
            width: 32px;
            height: 32px;
        }
        .session-ellipsis {
            font-size: 32px;
            color: #b23c1a;
        }
        .session-btn-row {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        
        @media (min-width: 2560px) and (max-height: 6560px) {
            .logo { width: 320px; margin-top: 40px; margin-bottom: 20px; }
            .title { font-size: 100px; }
            .greeting { font-size: 50px; }

            .svg-btn { width: 290px; height: 90px; }
            .svg-btn-text { font-size: 50px; }

            .input-wrapper { width: 480px; height: 100px; }
            .input-field { font-size: 50px;}

            .games-container { max-width: 560px; min-height: 180px; height: 630px; margin-top: 0px;}
            .games-title { font-size: 50px; }
        }
        @media (min-width: 600px) and (max-height: 1300px) {
            .logo { width: 300px; margin-top: 40px; margin-bottom: 20px; }
            .title { font-size: 85px; }
            .greeting { font-size: 45px; margin: 16px 0 24px 0;}

            .svg-btn { width: 320px; height: 80px; }
            .svg-btn-text { font-size: 45px; }

            .input-wrapper { width: 440px; height: 90px; }
            .input-field { font-size: 45px;}
        }
        @media (min-width: 390px) and (max-height: 932px) { 
            .logo { width: 180px; margin-top: 20px; margin-bottom: 10px; }
            .title { font-size: 50px; }
            .greeting { font-size: 35px; margin: 6px 0 6px 0;}

            .form { gap: 6px;}

            .svg-btn { width: 190px; height: 60px; }
            .svg-btn-text { font-size: 35px; }

            .input-wrapper { width: 300px; height: 75px; }
            .input-field { font-size: 35px;}

            .games-container { max-width: 365px; height: 476px; margin-top: 0px;}
            .games-title { font-size: 50px; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">Connect</div>
    <form class="form">
        <div class="input-wrapper">
            <img src="ui-elements/svg/enter_field.svg" class="input-bg" alt="session-bg">
            <input type="text"  id="inputSessionId" class="input-field" placeholder="session id" autocomplete="off">
        </div>
        <div class="buttons">
            <div class="svg-btn" onclick="window.location.href='index.html'">
                <img src="ui-elements/svg/red_button.svg" alt="BACK" style="width:100%;height:100%;pointer-events:none;user-select:none;">
                <span class="svg-btn-text">BACK</span>
            </div>
            <div class="svg-btn" onclick="connectToSession()">
                <img src="ui-elements/svg/blue_button.svg" alt="CONNECT" style="width:100%;height:100%;pointer-events:none;user-select:none;">
                <span class="svg-btn-text">CONNECT</span>
            </div>
        </div>
    </form>
    <div class="games-container" id="sessionsContainer">
        <div class="games-title">Available Sessions</div>
        <div class="games-headers">
            <div class="games-headers-col">
                <img src="images/clock.png" alt="Move" class="header-icon">
            </div>
            <div class="games-headers-col-center">
                <img src="ui-elements/settings_v1.png" alt="Settings" class="header-icon">
            </div>
            <div class="games-headers-col-right">
                <img src="ui-elements/players.png" alt="Players" class="header-icon">
            </div>
        </div>
        <div class="games-list" id="sessionsList"></div>
    </div>
    <script src="common.js"></script>
    <script>
    async function loadSessions() {
        const host = getBackendUrl();
        const resp = await fetch(`${host}/api/sessions`);
        if (!resp.ok) return;
        const sessions = await resp.json();
        const list = document.getElementById('sessionsList');
        list.innerHTML = '';
        if (!sessions.length) {
            list.innerHTML = '<div style="text-align:center;color:#b23c1a;font-family:Castlefire;font-size:28px; margin-top: 12px;">No sessions found</div>';
            return;
        }
        sessions.forEach(sess => {
            const el = document.createElement('div');
            el.className = 'game-item';
            // Первая строка: flex, justify-between
            const row = document.createElement('div');
            row.className = 'session-row';
            // Слева: только значение времени
            const left = document.createElement('div');
            left.className = 'session-col-left';
            left.innerHTML = `<span class="session-time">${sess.setting.secondsToMove}s</span>`;
            // Центр: чекбоксы или троеточие
            const center = document.createElement('div');
            center.className = 'session-col-center';
            let hasSetting = false;
            if (sess.setting.undoMove) { center.innerHTML += `<img src="images/undo.png" title="Undo" class="session-settings-icon">`; hasSetting = true; }
            if (sess.setting.grave) { center.innerHTML += `<img src="images/grave.png" title="Grave" class="session-settings-icon">`; hasSetting = true; }
            if (sess.setting.cut) { center.innerHTML += `<img src="images/cut.png" title="Cut" class="session-settings-icon">`; hasSetting = true; }
            if (sess.setting.demolition) { center.innerHTML += `<img src="images/demolition.png" title="Demolition" class="session-settings-icon">`; hasSetting = true; }
            if (!hasSetting) center.innerHTML = '<span class="session-ellipsis">...</span>';
            // Справа: только значение игроков
            const right = document.createElement('div');
            right.className = 'session-col-right';
            right.innerHTML = `<span class="session-players">${sess.connectedUsers}/${sess.totalUsers}</span>`;
            row.appendChild(left);
            row.appendChild(center);
            row.appendChild(right);
            // Вторая строка: кнопка
            const btnRow = document.createElement('div');
            btnRow.className = 'session-btn-row';
            btnRow.innerHTML = `<button class="svg-btn-in-conatiner">
                <img src="ui-elements/svg/yellow_button.svg" alt="CONNECT" style="width:100%;height:100%;pointer-events:none;user-select:none;">
                <span class="svg-btn-text-in-conatiner">CONNECT</span>
            </button>`;
            btnRow.querySelector('button').onclick = () => {
                connectSession(sess.id);
            };
            // Собираем блок
            el.appendChild(row);
            el.appendChild(btnRow);
            list.appendChild(el);
        });
    }
    document.addEventListener('DOMContentLoaded', loadSessions);

    function connectSession(sessionId) {
    window.location.href = `game.html?session=${sessionId}`;
    }

    async function connectToSession() {
        const inputSessionId = document.getElementById('inputSessionId').value.trim();
        
        if (!inputSessionId) {
            alert('Please enter a session ID');
            return;
        }

        try {
            const response = await fetch(`${getBackendUrl()}/api/sessions/${inputSessionId}`);
            
            if (response.status === 404) {
                alert('Session not found');
                return;
            }
            
            if (response.status === 200) {
                window.location.href = `game.html?session=${inputSessionId}`;
            } else {
                alert('Error connecting to session');
            }
        } catch (error) {
            alert('Error connecting to server');
        }
    }
    </script>
</body>
</html>

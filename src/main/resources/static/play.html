<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Play</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <link rel="stylesheet" href="main.css">
    <style>
        .form {
            align-items: center; 
        }
        .buttons {
            display: flex;
            flex-direction: row;
            gap: 0;
        }
        .svg-btn-in-conatiner {
            width: 200px;
            height: 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            background: none;
            border: none;
            will-change: transform;
        }
        .svg-btn-in-conatiner:hover, .svg-btn-in-conatiner:focus {
            transform: scale(1.08);
        }
        .svg-btn-in-conatiner:active {
            transform: scale(0.94);
        }
        .svg-btn-text-in-conatiner {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            letter-spacing: 2px;
        }
        .session-btn-row {
            display: flex;
            justify-content: center;
        }
        .session-row {
            display: flex;
            flex: 1;
        }
        .table-item-value-align-center {
            gap: 6px;
        }
        .session-settings-icon {
            width: 32px;
            height: 32px;
        }
        .session-ellipsis {
            font-family: rusty_typewriter;
            font-size: 32px;
            color: #b23c1a;
        }
        @media (min-width: 390px) { 
            .logo { width: 180px; margin-top: 10px; margin-bottom: 10px; }
            .title { font-size: 50px; }

            .input-wrapper-new { width: 300px; height: 70px; }
            .input-field-new { font-size: 35px; width: 256px; height: 62px; border-radius: 16px; }
            
            .svg-btn { width: 190px; height: 60px;}
            .svg-btn-text { font-size: 35px; }

            .form { gap: 8px; margin-bottom: 8px; }
            
            .container { max-width: 340px; max-height: 320px; margin-top: 3px; padding: 12px 24px; }
            .container-headers { padding-bottom: 8px; }

            .games-headers { padding-bottom: 8px; }
            .container-header-icon { height: 48px; }

            .table-item-text-value { font-size: 24px; }
            .session-settings-icon { width: 32px; height: 32px; }
            .session-ellipsis { font-size: 24px; }

            .svg-btn-in-conatiner { width: 180px; height: 60px; }
            .svg-btn-text-in-conatiner { font-size: 32px; }
        }
        @media (min-width: 600px) {
            .logo { width: 190px; margin-top: 5px; margin-bottom: 5px; }
            .title { font-size: 60px; }

            .input-wrapper-new { width: 440px; height: 80px; }
            .input-field-new { font-size: 40px; width: 316px; height: 75px; border-radius: 18px; }

            .svg-btn { width: 210px; height: 67px; }
            .svg-btn-text { font-size: 40px; }

            .form { gap: 12px; margin-bottom: 12px; }

            .container { max-width: 400px; max-height: 317px; margin-top: 0; padding: 12px 24px; }
            .container-headers { padding-bottom: 12px; }

            .games-headers { padding-bottom: 12px; }
            .container-header-icon { height: 48px; }

            .table-item-text-value { font-size: 24px; }
            .session-settings-icon { width: 32px; height: 32px; }
            .session-ellipsis { font-size: 24px; }

            .svg-btn-in-conatiner { width: 180px; height: 60px; }
            .svg-btn-text-in-conatiner { font-size: 32px; }

        }
        @media (min-width: 2560px) {
            .logo { width: 320px; margin-top: 50px; margin-bottom: 20px; }
            .title { font-size: 100px; }

            .input-wrapper-new { width: 500px; height: 100px; }
            .input-field-new { font-size: 50px; height: 89px; width: 405px; height: 94px; border: 4px solid transparent; border-radius: 24px; }

            .svg-btn { width: 290px; height: 90px; }
            .svg-btn-text { font-size: 50px; }
            
            .form { gap: 16px; margin-bottom: 16px; }

            .container { max-width: 570px; max-height: 670px; margin-top: 0; padding: 12px 24px; }
            .container-headers { padding-bottom: 16px; }

            .games-headers { padding-bottom: 16px; }
            .container-header-icon { height: 64px; }

            .table-item-text-value { font-size: 36px; }
            .session-settings-icon { width: 44px; height: 44px; }
            .session-ellipsis { font-size: 32px; }

            .svg-btn-in-conatiner { width: 200px; height: 60px; }
            .svg-btn-text-in-conatiner { font-size: 32px; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">Connect</div>
    <form class="form">
        <div class="input-wrapper-new">
            <img src="ui-elements/svg/enter_field.svg" class="input-bg" alt="session-bg">
            <input type="text"  id="inputSessionId" class="input-field-new" placeholder="Session id" autocomplete="off">
        </div>
        <div class="buttons">
            <div class="svg-btn" onclick="window.location.href='index.html'">
                <img src="ui-elements/svg/red_button.svg" alt="BACK" style="width:100%;height:100%;">
                <span class="svg-btn-text">BACK</span>
            </div>
            <div class="svg-btn" onclick="connectToSession()">
                <img src="ui-elements/svg/blue_button.svg" alt="CONNECT" style="width:100%;height:100%;">
                <span class="svg-btn-text">CONNECT</span>
            </div>
        </div>
    </form>
    <div class="container" id="sessionsContainer">
        <!-- <div class="games-title">Available Sessions</div> -->
        <div class="container-headers">
            <div class="container-header-row-icons container-headers-col-icon-left">
                <img src="ui-elements/clock_v2.png" alt="Move" class="container-header-icon">
            </div>
            <div class="container-header-row-icons container-headers-col-icon-center">
                <img src="ui-elements/settings_v1.png" alt="Settings" class="container-header-icon">
            </div>
            <div class="container-header-row-icons container-headers-col-icon-right">
                <img src="ui-elements/players_v9.png" alt="Players" class="container-header-icon">
            </div>
        </div>
        <div class="container-into-container" id="sessionsList"></div>
    </div>
    <script src="common.js"></script>
    <script>
    async function loadSessions() {
        const host = getBackendUrl();
        const resp = await fetch(`${host}/api/sessions`);
        if (!resp.ok) return;
        const sessions = await resp.json();
        const list = document.getElementById('sessionsList');
        list.innerHTML = '';
        if (!sessions.length) {
            list.innerHTML = '<div class="session-ellipsis" style="text-align:center;font-size:32px;margin-top:12px;">Available sessions not found</div>';
            return;
        }
        sessions.forEach(sess => {
            const el = document.createElement('div');
            el.className = 'table-item-with-icons';
            // Первая строка: flex, justify-between
            const row = document.createElement('div');
            row.className = 'session-row';
            // Слева: только значение времени
            const left = document.createElement('div');
            left.className = 'session-row table-item-value-align-left';
            left.innerHTML = `<span class="table-item-text-value">${sess.setting.secondsToMove}s</span>`;
            // Центр: чекбоксы или троеточие
            const center = document.createElement('div');
            center.className = 'session-row table-item-value-align-center';
            let hasSetting = false;
            if (sess.setting.undoMove) { center.innerHTML += `<img src="images/undo.png" title="Undo" class="session-settings-icon">`; hasSetting = true; }
            if (sess.setting.grave) { center.innerHTML += `<img src="images/grave.png" title="Grave" class="session-settings-icon">`; hasSetting = true; }
            if (sess.setting.cut) { center.innerHTML += `<img src="images/cut.png" title="Cut" class="session-settings-icon">`; hasSetting = true; }
            if (sess.setting.demolition) { center.innerHTML += `<img src="images/demolition.png" title="Demolition" class="session-settings-icon">`; hasSetting = true; }
            if (!hasSetting) center.innerHTML = '<span class="session-ellipsis" style="text-align:center;">No modifiers</span>';
            // Справа: только значение игроков
            const right = document.createElement('div');
            right.className = 'session-row table-item-value-align-right';
            right.innerHTML = `<span class="table-item-text-value">${sess.connectedUsers}/${sess.totalUsers}</span>`;
            row.appendChild(left);
            row.appendChild(center);
            row.appendChild(right);
            // Вторая строка: кнопка
            const btnRow = document.createElement('div');
            btnRow.className = 'session-btn-row';
            btnRow.innerHTML = `<button class="svg-btn-in-conatiner">
                <img src="ui-elements/svg/yellow_button.svg" alt="CONNECT" style="width:100%;height:100%;">
                <span class="svg-btn-text-in-conatiner">CONNECT</span>
            </button>`;
            btnRow.querySelector('button').onclick = () => {
                connectSession(sess.id);
            };
            // Собираем блок
            el.appendChild(row);
            el.appendChild(btnRow);
            list.appendChild(el);
        });
    }
    document.addEventListener('DOMContentLoaded', loadSessions);

    function connectSession(sessionId) {
    window.location.href = `game.html?session=${sessionId}`;
    }

    async function connectToSession() {
        const inputSessionId = document.getElementById('inputSessionId').value.trim();
        
        if (!inputSessionId) {
            alert('Please enter a session ID');
            return;
        }

        try {
            const response = await fetch(`${getBackendUrl()}/api/sessions/${inputSessionId}`);
            
            if (response.status === 404) {
                alert('Session not found');
                return;
            }
            
            if (response.status === 200) {
                window.location.href = `game.html?session=${inputSessionId}`;
            } else {
                alert('Error connecting to session');
            }
        } catch (error) {
            alert('Error connecting to server');
        }
    }
    </script>
</body>
</html>

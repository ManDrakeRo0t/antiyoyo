<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>World Wars - Editor</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @font-face {
            font-family: 'Castlefire';
            src: url('fonts/Castlefire.ttf') format('truetype'),
                 url('fonts/Castlefire.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        html {
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100%;
            margin: 0;
            background: #fff8dceb;
            font-family: 'Castlefire';
            overflow: hidden;
        }
        .top-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: #fff8dceb;
            border-bottom: 3px solid #7a6a4d;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            flex-wrap: nowrap;
            gap: 8px;
            justify-content: flex-start;
        }
        .menu-section {
            display: flex;
            align-items: center;
            gap: 0;
            position: relative;
        }
        .menu-section label {
            font-family: 'Castlefire';
            font-size: 24px;
            font-weight: bold;
            color: #7a6a4d;
            white-space: nowrap;
        }
        .input-wrapper {
            position: relative;
            width: 300px;
            height: 60px;
        }
        .input-bg {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0; top: 0;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }
        .input-field {
            position: absolute;
            left: 0; top: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Castlefire';
            font-size: 44px;
            color: #222;
            padding: 0 40px;
            z-index: 2;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .input-field::placeholder {
            color: #a1966d;
            opacity: 1;
        }
        .input-field[type=number]::-webkit-inner-spin-button,
        .input-field[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .tool-button {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 0;
            cursor: pointer;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #fff8dceb;
            transition: all 0.3s ease;
            font-family: 'Castlefire';
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-button:hover {
            transform: scale(1.1);
            border-color: #4CAF50;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: opacity 0.3s cubic-bezier(0.4,0,0.2,1), transform 0.3s cubic-bezier(0.4,0,0.2,1);
            position: absolute;
            background: #fff8dceb;
            z-index: 1002;
            border-radius: 16px;
            padding: 15px;
            top: 100%;
            left: 0;
            margin-top: 20px;
            border: 2px solid #7a6a4d;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .dropdown.open .dropdown-content {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .dropdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 24px;
        }
        .color-button {
            width: 60px;
            height: 60px;
            border: 3px solid #7a6a4d;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.22s cubic-bezier(0.4,0,0.2,1), box-shadow 0.22s cubic-bezier(0.4,0,0.2,1), background-color 0.22s;
        }
        .color-button.selected {
            box-shadow: 0 0 0 4px #ffe066, 0 2px 8px rgba(0,0,0,0.12);
            background-color: #fffbe6;
            transform: scale(1.18);
            z-index: 2;
        }
        .color-button:hover, .color-button:focus {
            transform: scale(1.18);
            z-index: 2;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            margin-top: 120px;
        }
        canvas {
            display: block;
            background-color: #808080;
        }   
        .svg-btn {
            width: 200px;
            height: 70px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            transform-origin: center center;
            will-change: transform;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .svg-btn:hover, .svg-btn:focus {
            transform: scale(1.08);
            box-shadow: none;
            z-index: 2;
        }
        .svg-btn:active {
            transform: scale(0.92);
            transition: transform 0.1s ease-out;
        }
        .svg-btn-text {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            pointer-events: none;
            letter-spacing: 1px;
            user-select: none;
            transform: none !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        .dropdown-tool-icon {
            width: 60px;
            height: 60px;
            background-size: contain !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
            border: none;
            border-radius: 0;
            background-color: transparent;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.22s cubic-bezier(0.4,0,0.2,1), box-shadow 0.22s cubic-bezier(0.4,0,0.2,1), background-color 0.22s;
        }
        .dropdown-tool-icon:hover, .dropdown-tool-icon:focus {
            transform: scale(1.18);
            z-index: 2;
        }
        .dropdown-tool-icon.selected {
            box-shadow: 0 0 0 4px #ffe066, 0 2px 8px rgba(0,0,0,0.12);
            border-radius: 12px;
            background-color: #fffbe6;
            outline: none;
            transform: scale(1.18);
        }
        .dropdown:focus-within .dropdown-content,
        .dropdown.open .dropdown-content {
            display: block;
        }
        @media (min-width: 390px) and (max-width: 599px) { 
        .top-menu {
            height: auto;
            padding: 20px;
            display: block;
            flex-direction: column;
            align-items: stretch;
            white-space: nowrap;
        }
        .top-menu > .menu-section {
            display: inline-block;
            vertical-align: top;
        }
        /* Первый ряд - поля ввода и APPLY кнопка */
        .top-menu > .menu-section:nth-child(-n+3) {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .top-menu > .menu-section:nth-child(3) {
            margin-top: 2px;
            margin-bottom: 6px;
            transform: translateX(-13%); /* Компенсируем существующий отступ */
        }
        /* Второй ряд - контейнер для инструментов с горизонтальным скроллом */
        .tool-buttons-container {
            display: flex;
            overflow-x: auto;
            gap: 8px;
        }
        /* Принудительно размещаем tool-button в одну строку */
        .top-menu > .menu-section:nth-child(n+4):not(:nth-last-child(-n+2)) {
            display: inline-block;
            white-space: nowrap;
        }
        /* Общие стили для элементов */
        .input-wrapper {
            width: 200px; height: 40px;
            margin-left: 0;
            margin-bottom: 8px;
        }
        .tool-button {
            /*width: 50px;*/
            width: 70px;
            height: 60px;
            /*flex-shrink: 0;*/
            /*margin-left: 97%;*/

        }

        .dropdown-content {
            margin-top: 2px;
        }
        /* Третий ряд - action кнопки (CREATE и BACK) */
        .top-menu > .menu-section:nth-last-child(-n+2) {
            display: block;
            width: 100%;
            margin-top: 8px;
        }
        .svg-btn {
            width: 180px;
            height: 40px;
            margin-top: 0;
            margin-left: 25%;
        }
        /* Остальные стили */
        #container {
            width: 100%;
            height: 40%;
            padding-top: 150px;
        }
        .input-field {
            font-size: 25px;
            padding: 0 30px;
        }
        
        .dropdown-grid {
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 2px;
        }
        .color-button {
            margin-left: 2px;
            margin-top: 5px;
            width: 24px;
            height: 24px;
        }
        .dropdown-tool-icon {
            width: 35px;
            height: 35px;
        }
        .svg-btn-text {
            font-size: 25px;
        }
        }   
        @media (min-width: 600px) and (max-width: 2059px) {
            .top-menu { height: 100px; padding: 0px; gap: 4px; }
            #container { width: 100vw; height: 100vh; margin-top: 100px; }

            .input-wrapper { width: 260px; height: 70px; margin-left: 10px;}
            .input-field { font-size: 35px; padding: 0 30px; }

            .tool-button { width: 56px; height: 56px; font-size: 18px; }

            .dropdown-content { padding: 6px; margin-top: 8px; }
            .dropdown-grid { grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)); gap: 14px; }
            .color-button { width: 30px; height: 30px; }
            .dropdown-tool-icon { width: 35px; height: 35px; }

            .svg-btn { width: 200px; height: 60px;  }
            .svg-btn-text { font-size: 40px; }
        }
        @media (min-width: 2560px)  {
            .top-menu { height: 120px; padding: 0 20px; gap: 8px; }
            #container { width: 100vw; height: 100vh; margin-top: 120px; }

            .input-wrapper { width: 480px; height: 100px; }
            .input-field { font-size: 50px; padding: 0 40px; }

            .tool-button { width: 100px; height: 100px; font-size: 24px; }

            .dropdown-content { padding: 15px; margin-top: 20px; }
            .dropdown-grid { grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)); gap: 24px; }
            .color-button { width: 60px; height: 60px; }
            .dropdown-tool-icon { width: 60px; height: 60px; }

            .svg-btn { width: 320px; height: 90px; }
            .svg-btn-text { font-size: 50px; }
        }
        
        
        
    </style>
</head>
<body>

        <div class="menu-section">

    <div id="container">
        <canvas id="hexCanvas"></canvas>
    </div>
    <script src="common.js"></script>
    <script>

        
        // Canvas setup
        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        const config = {
            hexSize: 30,
            minHexSize: 10,
            maxHexSize: 60,
            backgroundColor: '#ffffff',
            gridColor: '#000000',
            selectedHexColor: '#ffff00',
            selectedHexBorderWidth: 3
        };

        // Editor state
        const state = {
            selectedTool: 'delete',
            selectedColor: 'EMPTY',
            selectedEntity: null,
            offsetX: 0,
            offsetY: 0,
            isDragging: false,
            lastMouseX: 0,
            lastMouseY: 0,
            scale: 1,
            minScale: 0.5,
            maxScale: 3,
            isMouseDown: false
        };

        // Map data
        let mapData = {};

        // Color mapping function
        function getColorFromName(colorName) {
            const colorMap = {
        'EMPTY': '#e3dfda',  // серый
        'RED': '#ff0000',    // красный
        'BLUE': '#0000ff',   // синий
        'GREEN': '#00ff00',  // зеленый
        'YELLOW': '#ffff00', // желтый
        'PURPLE': '#800080', // фиолетовый
        'ORANGE': '#ffa500', // оранжевый
        'PINK': '#FEC0D5',  // черный
        'CIAN': '#23deff'   // белый
    };
            return colorMap[colorName] || config.backgroundColor;
        }

        // Entity images
        const entityImages = {
            'BIG_TOWER': 'images/big_tower.png',
            'TOWER': 'images/tower.png',
            'FACTORY': 'images/factory.png',
            'UNIT_1': 'images/unit1.png',
            'UNIT_2': 'images/unit2.png',
            'UNIT_3': 'images/unit3.png',
            'TANK': 'images/tank.png',
            'TOWN_HALL': 'images/town-hall.png',
            'TREE': 'images/tree.png',
            'GRAVE': 'images/grave.png',
            'STONE': 'images/stone.png',
            'MINE': 'images/mine.png',
            'MINE_FARM' : 'images/mine-farm.png',
            'FOREST' : 'images/forest.png',
            'FOREST_FARM' : 'images/forest-farm.png',
        };

        // Preload images
        const preloadedImages = {};
        function preloadImages() {
            Object.entries(entityImages).forEach(([type, path]) => {
                const img = new Image();
                img.src = path;
                preloadedImages[type] = img;
            });
        }

        function getEntityImage(entityType) {
            return preloadedImages[entityType];
        }

        // Tool selection
        function selectTool(tool) {
            state.selectedTool = tool;
            state.selectedEntity = tool;
            
            // Update UI
            document.querySelectorAll('.tool-button').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');

            // Снимаем выделение со всех иконок
            document.querySelectorAll('.dropdown-tool-icon').forEach(btn => {
                btn.classList.remove('selected');
            });
            // Если выбрана иконка из выпадающего списка, выделяем её
            const toolBtn = document.querySelector(`.dropdown-tool-icon[onclick*="selectTool('${tool}')"]`);
            if (toolBtn) {
                toolBtn.classList.add('selected');
            }
        }

        // Color selection
        function selectColor(color) {
            state.selectedColor = color;
            state.selectedTool = 'color';
            
            // Update UI
            document.querySelectorAll('.color-button').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
            
            document.querySelectorAll('.tool-button').forEach(btn => {
                btn.classList.remove('selected');
            });
           
        }

        // Generate map
        function generateMap() {
            const size = parseInt(document.getElementById('mapSize').value);
            mapData = {};
            
            for (let x = -size; x <= size; x++) {
                for (let y = -size; y <= size; y++) {
                    for (let z = -size; z <= size; z++) {
                        if (x + y + z === 0) {
                            const hexKey = `Vector3(x=${x}, y=${y}, z=${z})`;
                            mapData[hexKey] = {
                                vector: { x, y, z },
                                color: 'EMPTY',
                                entity: {
                                    type: 'FIELD'
                                }
                            };
                        }
                    }
                }
            }
            
            renderGrid();
        }

        // Canvas functions
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 120; // Account for top menu
            renderGrid();
        }

        function cubeToPixel(cube) {
            const size = config.hexSize * state.scale;
            const x = size * (3/2) * cube.x;
            const y = size * (Math.sqrt(3)/2 * cube.x + Math.sqrt(3) * cube.z);
            return {
                x: (canvas.width / 2) + x + state.offsetX,
                y: (canvas.height / 2) + y + state.offsetY
            };
        }

        function pixelToCube(x, y) {
            const size = config.hexSize * state.scale;
            
            const adjustedX = x - (canvas.width / 2) - state.offsetX;
            const adjustedY = y - (canvas.height / 2) - state.offsetY;
            
            const q = (2/3) * adjustedX / size;
            const r = (-1/3) * adjustedX / size + (Math.sqrt(3)/3) * adjustedY / size;
            
            let rx = Math.round(q);
            let ry = Math.round(-q - r);
            let rz = Math.round(r);
            
            const xDiff = Math.abs(rx - q);
            const yDiff = Math.abs(ry - (-q - r));
            const zDiff = Math.abs(rz - r);
            
            if (xDiff > yDiff && xDiff > zDiff) {
                rx = -ry - rz;
            } else if (yDiff > zDiff) {
                ry = -rx - rz;
            } else {
                rz = -rx - ry;
            }
            
            return { x: rx, y: ry, z: rz };
        }

        function drawHexagon(x, y, size, hex) {
            // Don't draw hexagons with AIR entity type
            if (hex.entity && hex.entity.type === 'AIR') {
                return;
            }

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const xi = x + size * Math.cos(angle);
                const yi = y + size * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(xi, yi);
                } else {
                    ctx.lineTo(xi, yi);
                }
            }
            ctx.closePath();
            
            // Fill with color
            ctx.fillStyle = getColorFromName(hex.color);
            ctx.fill();
            
            // Draw border
            ctx.lineWidth = 1;
            ctx.strokeStyle = config.gridColor;
            ctx.stroke();

            // Draw entity icon if present
            if (hex.entity && hex.entity.type && hex.entity.type !== 'FIELD' && hex.entity.type !== 'AIR') {
                const img = getEntityImage(hex.entity.type);
                if (img && img.complete) {
                    const iconSize = size * 0.6;
                    ctx.drawImage(img, 
                        x - iconSize/2, 
                        y - iconSize/2, 
                        iconSize, 
                        iconSize
                    );
                }
            }
        }

        function renderGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const size = config.hexSize * state.scale;

            Object.values(mapData).forEach(hex => {
                if (!hex || !hex.vector) return;
                
                const pixelPos = cubeToPixel(hex.vector);
                drawHexagon(pixelPos.x, pixelPos.y, size, hex);
            });
        }

        // Mouse event handlers
        function handleMouseDown(e) {
            if (e.button === 0) { // Left click
                state.isMouseDown = true;
                handleHexClick(e);
            } else if (e.button === 1 || e.button === 2) { // Middle or right click
                state.isDragging = true;
                state.lastMouseX = e.clientX;
                state.lastMouseY = e.clientY;
                canvas.style.cursor = 'grabbing';
            }
        }

        function handleMouseMove(e) {
            if (state.isDragging) {
                const dx = e.clientX - state.lastMouseX;
                const dy = e.clientY - state.lastMouseY;
                state.offsetX += dx;
                state.offsetY += dy;
                state.lastMouseX = e.clientX;
                state.lastMouseY = e.clientY;
                renderGrid();
            } else if (state.isMouseDown) {
                handleHexClick(e);
            }
        }

        function handleMouseUp() {
            state.isDragging = false;
            state.isMouseDown = false;
            canvas.style.cursor = 'grab';
        }

        function handleWheel(e) {
            e.preventDefault();

            const delta = e.deltaY > 0 ? -1 : 1;
            const scaleFactor = 1.1;

            const mouseX = e.clientX - canvas.offsetLeft;
            const mouseY = e.clientY - canvas.offsetTop;
            const worldX = (mouseX - canvas.width/2 - state.offsetX) / state.scale;
            const worldY = (mouseY - canvas.height/2 - state.offsetY) / state.scale;

            const newScale = delta > 0 ?
                Math.min(state.scale * scaleFactor, state.maxScale) :
                Math.max(state.scale / scaleFactor, state.minScale);

            if (newScale !== state.scale) {
                state.offsetX = mouseX - canvas.width/2 - worldX * newScale;
                state.offsetY = mouseY - canvas.height/2 - worldY * newScale;
                state.scale = newScale;
                renderGrid();
            }
        }

        function handleHexClick(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const cubicCoords = pixelToCube(x, y);
            const hexKey = `Vector3(x=${cubicCoords.x}, y=${cubicCoords.y}, z=${cubicCoords.z})`;
            
            if (mapData[hexKey]) {
                const pixelPos = cubeToPixel(mapData[hexKey].vector);
                const size = config.hexSize * state.scale;
                
                const dx = x - pixelPos.x;
                const dy = y - pixelPos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const hexRadius = size;
                
                if (distance <= hexRadius) {
                    applyTool(hexKey);
                }
            } else {
                // Create new hexagon if clicking on empty space and placing entity or using color tool
                if ((state.selectedTool !== 'delete' && state.selectedTool !== 'deleteHex') || state.selectedTool === 'color') {
                    if (state.selectedTool === 'color' || (state.selectedEntity && entityImages[state.selectedEntity])) {
                        mapData[hexKey] = {
                            vector: cubicCoords,
                            color: state.selectedTool === 'color' ? state.selectedColor : 'EMPTY',
                            entity: { type: state.selectedTool === 'color' ? 'FIELD' : state.selectedEntity }
                        };
                        renderGrid();
                    }
                }
            }
        }

        function applyTool(hexKey) {
            const hex = mapData[hexKey];
            
            switch (state.selectedTool) {
                case 'delete':
                    // Remove entity but keep hex
                    hex.entity = { type: 'FIELD' };
                    break;
                    
                case 'deleteHex':
                    // Delete hexagon by setting entity type to AIR
                    hex.entity = { type: 'AIR' };
                    break;
                    
                case 'color':
                    hex.color = state.selectedColor;
                    // If hex was AIR, restore it to FIELD when coloring
                    if (hex.entity.type === 'AIR') {
                        hex.entity = { type: 'FIELD' };
                    }
                    break;
                    
                default:
                    // Entity placement - only if hex is not AIR
                    if (state.selectedEntity && entityImages[state.selectedEntity] && hex.entity.type !== 'AIR') {
                        hex.entity = { type: state.selectedEntity };
                    }
                    break;
            }
            
            renderGrid();
        }

        // File operations
        async function saveMap() {
            const levelName = document.getElementById('levelName').value || 'unnamed_level';
            
            // Convert map data from object format to array format
            const mapArray = Object.values(mapData)
                .filter(hex => hex.entity.type !== 'AIR')
                .map(hex => ({
                    vector: hex.vector,
                    color: hex.color,
                    entity: hex.entity.type // Convert from object to string
                }));
            
            const data = {
                name: levelName,
                map: mapArray
            };
            
            const response = await fetch(`${getBackendUrl()}/api/maps`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert("Карта сохранена")
                } else {
                    const errorData = await response.json();
                    alert(errorData.error);
                }

            // const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            // const url = URL.createObjectURL(blob);
            // const a = document.createElement('a');
            // a.href = url;
            // a.download = `${levelName}.json`;
            // a.click();
            // URL.revokeObjectURL(url);
        }

        function loadMap() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const data = JSON.parse(e.target.result);
                            
                            // Handle both old object format and new array format
                            if (Array.isArray(data.map)) {
                                // New array format
                                mapData = {};
                                data.map.forEach(hex => {
                                    const hexKey = `Vector3(x=${hex.vector.x}, y=${hex.vector.y}, z=${hex.vector.z})`;
                                    // Handle both string and object entity formats
                                    const entity = typeof hex.entity === 'string' 
                                        ? { type: hex.entity } 
                                        : hex.entity;
                                    mapData[hexKey] = {
                                        vector: hex.vector,
                                        color: hex.color,
                                        entity: entity
                                    };
                                });
                            } else {
                                // Old object format
                                mapData = data.map;
                            }
                            
                            document.getElementById('levelName').value = data.name || '';
                            renderGrid();
                        } catch (error) {
                            alert('Ошибка загрузки файла');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        // Initialize
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            preloadImages();

            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
            canvas.addEventListener('wheel', handleWheel, { passive: false });
            
            // Prevent context menu
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            
            // Generate initial map
            generateMap();
        }

        // Start the editor
        init();

// Drop-down hide delay logic
function setupDropdownWithDelay(dropdownId, buttonId) {
    const dropdown = document.getElementById(dropdownId);
    const button = document.getElementById(buttonId);
    let hideTimeout = null;
    let isFocused = false;

    function openDropdown() {
        dropdown.classList.add('open');
        if (hideTimeout) {
            clearTimeout(hideTimeout);
            hideTimeout = null;
        }
    }
    function closeDropdown() {
        dropdown.classList.remove('open');
    }
    // Открытие по фокусу или наведению
    button.addEventListener('focus', openDropdown);
    button.addEventListener('mouseenter', openDropdown);
    dropdown.addEventListener('mouseenter', openDropdown);

    // Новый способ: отслеживаем фокус внутри всего дропдауна
    dropdown.addEventListener('focusin', () => {
        isFocused = true;
        openDropdown();
    });
    dropdown.addEventListener('focusout', (e) => {
        isFocused = false;
        // Проверяем, ушёл ли фокус на элемент вне дропдауна
        hideTimeout = setTimeout(() => {
            if (!dropdown.contains(document.activeElement)) {
                closeDropdown();
            }
        }, 500);
    });
    // Также mouseleave (если мышь ушла и нет фокуса)
    dropdown.addEventListener('mouseleave', () => {
        hideTimeout = setTimeout(() => {
            if (!dropdown.contains(document.activeElement)) {
                closeDropdown();
            }
        }, 500);
    });
}
setupDropdownWithDelay('colorDropdown', 'colorDropdownBtn');
setupDropdownWithDelay('unitDropdown', 'unitDropdownBtn');

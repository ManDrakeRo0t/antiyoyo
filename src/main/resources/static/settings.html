<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Settings</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <link rel="stylesheet" href="main.css">
    <style>
        .settings-list {
            display: flex;
            flex-direction: column;
            /* align-items: center; */
            gap: 8px;
        }
        .setting-row {
            display: flex;
            /* align-items: center; */
            width: 280px;
            height: 70px;
            position: relative;
        }
        .border-for-field {
            border-radius: 0 40% 40% 0;
        }
        .setting-num {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Castlefire';
            font-size: 38px;
            color: #222;
            /* z-index: 3; */
        }
        .setting-label {
            display: flex;
            align-items: center;
            font-family: 'Castlefire';
            font-size: 38px;
            color: #222;
            padding-left: 110px;
            letter-spacing: 1px;
            z-index: 2;
            /* height: 100%; */
        }
        .setting-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 220px;
            height: 90px;
            cursor: pointer;
            /* display: flex; */
            /* align-items: center;
            justify-content: center;
            user-select: none;
            z-index: 2; */
            /* overflow: hidden; */
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            /* transform-origin: center center; */
            will-change: transform;
        }
        .setting-btn:hover, .setting-btn:focus {
            transform: translateY(-50%) scale(1.1);
            /* z-index: 2; */
        }
        .setting-btn:active {
            transform: translateY(-50%) scale(1);
            /* transition: transform 0.1s ease-out; */
        }
        .setting-btn img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* user-select: none; */
        }
        .setting-btn-text {
            position: absolute;
            /* left: 0;  */
            top: 0; 
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Castlefire';
            font-size: 38px;
            color: #222;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
        }
        @media (min-width: 390px) { 
            .logo { width: 180px; margin-top: 10px; margin-bottom: 10px; }
            .title { font-size: 50px; }

            .settings-list { gap: 0px; margin-top: 10px; }
            .setting-row { width: 320px; height: 90px; }
           
            .setting-num { font-size: 32px; left: 20px; }
            .setting-label { font-size: 30px; padding-left: 74px; }
            .setting-btn { width: 110px; height: 73.75px; left: 217px; }
            .setting-btn-text { font-size: 32px; }
            
            .svg-btn { width: 240px; height: 60px; margin-top: 66px;}
            .svg-btn-text { font-size: 35px; }
        }
        @media (min-width: 600px) {
            .logo { width: 190px; margin-top: 5px; margin-bottom: 5px; }
            .title { font-size: 60px; }

            .settings-list { gap: 0px; margin-top: 0; }
            .setting-row { width: 320px; height: 90px; }
           
            .setting-num { font-size: 40px; left: 18px; }
            .setting-label { font-size: 30px; padding-left: 74px; }
            .setting-btn { width: 200px; height: 73.75px; left: 174px; }
            .setting-btn-text { font-size: 32px; }
            
            .svg-btn { width: 280px; height: 67px; margin-top: 80px; }
            .svg-btn-text { font-size: 40px; }
        }
        @media (min-width: 2560px) {
            .logo { width: 320px; margin-top: 50px; margin-bottom: 20px; }
            .title { font-size: 100px; }

            .settings-list { gap: 0px; }
            .setting-row { width: 500px; height: 160px; }

            .setting-num { font-size: 64px; left: 24px; }
            .setting-label { font-size: 50px; padding-left: 130px; }
            .setting-btn { width: 400px; height: 116px; left: 265px; }
            .setting-btn-text { font-size: 50px; }

            .svg-btn { width: 360px; height: 90px; }
            .svg-btn-text { font-size: 50px; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">Settings</div>
    <div class="settings-list">
        <div class="setting-row">
            <img src="ui-elements/svg/field_with_button.svg" class ="border-for-field" style="width:100%;height:100%;position:absolute;">
            <span class="setting-num">#1</span>
            <span class="setting-label">MUSIC</span>
            <div class="setting-btn">
                <img src="ui-elements/svg/button_off.svg">
                <span class="setting-btn-text">OFF</span>
            </div>
        </div>
        <div class="setting-row">
            <img src="ui-elements/svg/field_with_button.svg" class ="border-for-field" style="width:100%;height:100%;position:absolute;">
            <span class="setting-num">#2</span>
            <span class="setting-label">VOLUME</span>
            <div class="setting-btn">
                <img src="ui-elements/svg/button_on.svg">
                <span class="setting-btn-text">ON</span>
            </div>
        </div>
        <div class="setting-row">
            <img src="ui-elements/svg/field_with_button.svg" class ="border-for-field" style="width:100%;height:100%;position:absolute;">
            <span class="setting-num">#3</span>
            <span class="setting-label">MILITARY</span>
            <div class="setting-btn">
                <img src="ui-elements/svg/button_on.svg">
                <span class="setting-btn-text">ON</span>
            </div>
        </div>
        <div class="setting-row">
            <img src="ui-elements/svg/field_with_button.svg" class ="border-for-field" style="width:100%;height:100%;position:absolute;">
            <span class="setting-num">#4</span>
            <span class="setting-label">DIPLOMACY</span>
            <div class="setting-btn">
                <img src="ui-elements/svg/button_on.svg">
                <span class="setting-btn-text">ON</span>
            </div>
        </div>
    </div>
    <div class="svg-btn" onclick="window.location.href='index.html'">
        <img src="ui-elements/svg/red_button.svg" alt="BACK" style="width:100%;height:100%;">
        <span class="svg-btn-text">BACK</span>
    </div>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.setting-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            const img = btn.querySelector('img');
            const text = btn.querySelector('.setting-btn-text');
            if (text.textContent.trim() === 'ON') {
                img.src = 'ui-elements/svg/button_off.svg';
                text.textContent = 'OFF';
            } else {
                img.src = 'ui-elements/svg/button_on.svg';
                text.textContent = 'ON';
            }
        });
    });
});
</script>
</body>
</html>

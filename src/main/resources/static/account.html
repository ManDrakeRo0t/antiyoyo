<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Account</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <style>
        @font-face {
            font-family: 'Castlefire';
            src: url('fonts/Castlefire.ttf') format('truetype'),
                 url('fonts/Castlefire.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        html {
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100%;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #f0cba3;
            font-family: 'Castlefire';
            user-select: none;
        }
        .logo {
            width: 180px;
            height: auto;
            margin-top: 40px;
            margin-bottom: 20px;
            display: block;
            pointer-events: none;
            user-select: none;
        }
        .title {
            font-family: 'Castlefire';
            font-size: 64px;
            color: #222;
            text-align: center;
            margin: 0;
            line-height: 1;
            user-select: none;
        }
        .greeting {
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            text-align: center;
            margin: 16px 0 32px 0;
            line-height: 1;
            user-select: none;
        }
        .stats {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            margin-bottom: 40px;
        }
        .stat-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .stat-icon {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 4px;
        }
        .stat-label {
            font-family: 'Castlefire';
            font-size: 22px;
            color: #b23c1a;
            background: #ffe6c0;
            border-radius: 12px;
            padding: 2px 18px;
            margin-bottom: 2px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .stat-value {
            font-family: 'Castlefire';
            font-size: 38px;
            color: #222;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .back-btn {
            width: 320px;
            height: 90px;
            margin: 40px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            transform-origin: center center;
            will-change: transform;
        }
        .back-btn:hover, .back-btn:focus {
            transform: scale(1.08);
            z-index: 2;
        }
        .back-btn:active {
            transform: scale(0.92);
            transition: transform 0.1s ease-out;
        }
        .back-btn img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            user-select: none;
        }
        .back-btn-text {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Castlefire';
            font-size: 50px;
            color: #222;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
        }
        @media (min-width: 2560px) and (max-height: 6560px) {
            .logo { width: 320px; }
            .title { font-size: 100px; }
            .greeting { font-size: 50px; }

            .stats { gap: 64px; margin-bottom: 150px;}
            .stat-icon { width: 120px; height: 120px; }
            .stat-label { font-size: 32px; border-radius: 24px; }
            .stat-value { font-size: 32px; }
            
            .back-btn { width: 320px; height: 90px; }
            .back-btn-text { font-size: 50px; }
        }
        @media (min-width: 600px) and (max-height: 1300px) {
            .logo { width: 300px; margin-top: 40px; margin-bottom: 20px; }
            .title { font-size: 85px; }
            .greeting { font-size: 45px; margin: 16px 0 24px 0;}
            
            .stats { gap: 32px; margin-bottom: 16px;}
            .stat-icon { width: 110px; height: 110px; }
            .stat-label { font-size: 32px; border-radius: 24px; }
            .stat-value { font-size: 32px; }

            .back-btn { width: 320px; height: 80px; }
            .back-btn-text { font-size: 45px; }
        }
        @media (min-width: 390px) and (max-height: 932px) { 
            .logo { width: 180px; margin-top: 20px; margin-bottom: 10px; }
            .title { font-size: 50px; }
            .greeting { font-size: 35px; margin: 6px 0 6px 0;}

            .stats { gap: 12px; margin-bottom: 0px; }
            .stat-block { gap: 8px; }
            .stat-icon { width: 70px; height: 70px; margin-bottom: 4px; }
            .stat-label { font-size: 24px; padding: 2px 18px; margin-bottom: 2px; }
            .stat-value { font-size: 32px; margin-bottom: 2px; }

            .back-btn { margin-top: 24px; width: 240px; height: 60px; }
            .back-btn-text { font-size: 35px; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">World Wars</div>
    <div class="greeting">{user_name}</div>
    <div class="stats">
        <div class="stat-block">
            <img src="ui-elements/user_rating.png" alt="rating" class="stat-icon">
            <div class="stat-label">Rating</div>
            <div class="stat-value">1455</div>
        </div>
        <div class="stat-block">
            <img src="ui-elements/user_wins.png" alt="wins" class="stat-icon">
            <div class="stat-label">Wins</div>
            <div class="stat-value">267</div>
        </div>
    </div>
    <div class="back-btn" onclick="window.location.href='index.html'">
        <img src="ui-elements/svg/red_button.svg" alt="BACK">
        <span class="back-btn-text">BACK</span>
    </div>
</body>
</html>

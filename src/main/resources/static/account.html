<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Account</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <link rel="stylesheet" href="main.css">
    <style>
        .stats {
            display: flex;
            gap: 64px;
        }
        .stat-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-icon {
            width: 90px;
            height: 90px;
        }
        .stat-label {
            font-family: 'Castlefire';
            font-size: 24px;
            color: #b23c1a;
            background: #ffe6c0;
            border-radius: 12px;
            padding: 2px 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .stat-value {
            font-family: 'rusty_typewriter';
            font-size: 32px;
            color: #222;
        }
        .game-result.win {
            color: #00BA0C;
        }
        .game-result.loss {
            color: #FF0000;
        }
        .game-result.safe {
            color: #ff7b00;
        }
        .game-result.gray {
            color: #666565;
        }
        .arrow-mobile {
            display: inline;
        }
        .arrow-desktop {
            display: inline;
        }
        @media (min-width: 390px) { 
            .logo { width: 180px; margin-top: 10px; margin-bottom: 10px; }
            .title { font-size: 50px; }

            .stats { gap: 12px; }

            .stat-icon { width: 70px; height: 70px; }
            .stat-label { font-size: 24px; padding: 2px 18px; }
            .stat-value { font-size: 32px; margin-top: 12px; }

            .container { max-width: 340px; height: 229px; margin-top: 6px; margin-bottom: 12px; padding: 12px 24px; }
            
            .games-title { font-size: 32px; margin-bottom: 0px; }
            
            .container-header-text { font-size: 24px; }
            
            .table-item-text-value { font-size: 24px; }
            

            .arrow-mobile {display: inline; }
            .arrow-desktop { display: none; }

            .svg-btn { width: 240px; height: 60px;}
            .svg-btn-text { font-size: 35px; }
        }
        @media (min-width: 600px)  {
            .logo { width: 190px; margin-top: 5px; margin-bottom: 5px; }
            .title { font-size: 60px; }
            
            .stats { gap: 20px; }
            
            .stat-icon { width: 70px; height: 70px; }
            .stat-label { font-size: 24px; padding: 2px 18px; }
            .stat-value { font-size: 32px; margin-top: 0 }

            .container { max-width: 340px; height: 243px; margin-top: 6px; margin-bottom: 12px; padding: 12px 24px; }

            .container-header-text { font-size: 24px; }
            
            .table-item-text-value { font-size: 24px; }
            
            .arrow-mobile { display: none; }
            .arrow-desktop { display: inline; }

            .svg-btn { width: 280px; height: 67px; }
            .svg-btn-text { font-size: 40px; }
        }
        @media (min-width: 2560px)  {
            .logo { width: 320px; margin-top: 50px; margin-bottom: 20px; }
            .title { font-size: 100px; }

            .stats { gap: 64px; margin-top: 12px; margin-bottom: 12px; }
            .stat-icon { width: 120px; height: 120px; }
            .stat-label { font-size: 32px; padding: 2px 18px; }
            .stat-value { font-size: 40px; margin-top: 0 }
            
            .container { max-width: 600px; height: 452px; margin-top: 10px; margin-bottom: 30px; padding: 12px 24px; }
            
            .container-header-text { font-size: 32px; }
            .table-item-text-value { font-size: 36px; }
            
            .arrow-mobile { display: none; }
            .arrow-desktop { display: inline; }
            
            .svg-btn { width: 360px; height: 90px; }
            .svg-btn-text { font-size: 50px; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <!-- <div class="title">Profile</div> -->
    <div class="title">...</div>
    <div class="stats">
        <div class="stat-block">
            <img src="ui-elements/user_games_v3.png" alt="games" class="stat-icon">
            <div class="stat-label">Game</div>
            <div class="stat-value">...</div>
        </div>
        <div class="stat-block">
            <img src="ui-elements/user_rating_v2.png" alt="rating" class="stat-icon">
            <div class="stat-label">Rating</div>
            <div class="stat-value">...</div>
        </div>
        <div class="stat-block">
            <img src="ui-elements/user_wins.png" alt="wins" class="stat-icon">
            <div class="stat-label">Wins</div>
            <div class="stat-value">...</div>
        </div>
    </div>
    <div class="container">
        <!-- <div class="games-title">Last Games</div> -->
        <div class="container-headers">
            <div class="container-header-text container-headers-col-text-left">Date</div>
            <div class="container-header-text container-headers-col-text-center">Place</div>
            <div class="container-header-text container-headers-col-text-right">Rating</div>
        </div>
        <!-- Это для мобилы: ↓ ↑ ⇅ -->
        <!-- Это для ПК    : 🡓 🡑 🡙 -->
        <div class="container-into-container"></div>
    </div>
    <div class="svg-btn" onclick="window.location.href='index.html'">
        <img src="ui-elements/svg/red_button.svg" alt="BACK" style="width:100%;height:100%;">
        <span class="svg-btn-text">BACK</span>
    </div>
    <script src="auth.js" ></script>
    <script src="common.js" ></script>
    <script>
    function pad2(n) { return n < 10 ? '0' + n : n; }
    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1);
    }
    function getArrow(rankDelta, desktop=true) {
        if (rankDelta > 0) return desktop ? '🡑' : '↑';
        if (rankDelta < 0) return desktop ? '🡓' : '↓';
        return desktop ? '🡙' : '⇅';
    }
    function getDeltaClass(rankDelta) {
        if (rankDelta > 0) return 'win';
        if (rankDelta < 0) return 'loss';
        return 'safe';
    }
    document.addEventListener('DOMContentLoaded', async function() {
        if (typeof getBackendUrl !== 'function' || typeof getUserId !== 'function') return;
        try {
            const response = await fetch(getBackendUrl() + '/api/users/history/' + getUserId());
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            // Заменяем {user_name}
            document.querySelectorAll('.title').forEach(e => e.textContent = data.login);
            // Статы
            const statBlocks = document.querySelectorAll('.stat-block');
            if (statBlocks.length >= 3) {
                statBlocks[0].querySelector('.stat-value').textContent = data.totalGames ?? 0;
                statBlocks[1].querySelector('.stat-value').textContent = data.rating ?? 0;
                statBlocks[2].querySelector('.stat-value').textContent = data.winGames ?? 0;
            }
            // Игры
            const gamesContainer = document.querySelector('.container-into-container');
            if (gamesContainer) {
                gamesContainer.innerHTML = '';
                (data.userHistory || []).forEach(game => {
                    // Найти текущего игрока
                    const me = (game.players || []).find(p => p.userId === getUserId());
                    const place = me ? me.place : '';
                    const rankDelta = me ? me.rankDelta : 0;
                    const deltaClass = getDeltaClass(rankDelta);
                    const desktopArrow = getArrow(rankDelta, true);
                    const mobileArrow = getArrow(rankDelta, false);
                    // Формируем блок
                    const item = document.createElement('div');
                    item.className = 'table-item';
                    item.innerHTML = `
                        <div class="table-item-text-value table-item-value-align-left">${formatDate(game.endTime)}</div>
                        <div class="table-item-text-value table-item-value-align-center">
                            <span class="table-item-text-value game-result ${deltaClass}">${place}</span> ୵ <span class="table-item-text-value game-result gray">${game.playersCount}</span>
                        </div>
                        <div class="table-item-text-value table-item-value-align-right">${rankDelta}<span class="table-item-text-value game-result ${deltaClass}">
                            <span class="arrow-desktop"> ${desktopArrow}</span>
                            <span class="arrow-mobile"> ${mobileArrow}</span>
                        </span>
                        </div>
                    `;
                    gamesContainer.appendChild(item);
                });
            }
        } catch (e) {
            // Ошибка — можно показать сообщение или оставить как есть

        }
    });
    </script>
</body>
</html>

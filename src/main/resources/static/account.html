<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Account</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <style>
        @font-face {
            font-family: 'Castlefire';
            src: url('fonts/Castlefire.ttf') format('truetype'),
                 url('fonts/Castlefire.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: rusty_typewriter;
                 src: url('fonts/rusty_typewriter.ttf') format('truetype'),
                 url('fonts/rusty_typewriter.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        html {
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100%;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #f0cba3;
            font-family: 'Castlefire';
            user-select: none;
        }
        .logo {
            width: 180px;
            height: auto;
            margin-top: 40px;
            margin-bottom: 20px;
            display: block;
            pointer-events: none;
            user-select: none;
        }
        .title {
            font-family: 'Castlefire';
            font-size: 64px;
            color: #222;
            text-align: center;
            margin: 0;
            line-height: 1;
            letter-spacing: 4px;
            user-select: none;
        }
        .greeting {
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            text-align: center;
            margin: 16px 0 16px 0;
            letter-spacing: 2px;
            line-height: 1;
            user-select: none;
        }
        .stats {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 64px;
            margin-bottom: 12px;
        }
        .stat-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-icon {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 4px;
        }
        .stat-label {
            font-family: 'Castlefire';
            font-size: 22px;
            color: #b23c1a;
            background: #ffe6c0;
            border-radius: 12px;
            padding: 2px 18px;
            margin-bottom: 2px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .stat-value {
            font-family: 'rusty_typewriter';
            font-size: 38px;
            color: #222;
            margin-bottom: 2px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background: #fff8dceb;
            border-radius: 24px;
            padding: 6px 24px;
            font-size: 1.3rem;
            line-height: 1.7;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
            user-select: none;
            /* overflow-y: auto;  <-- убираем скролл */
            /* overflow-x: hidden; */
            display: flex;
            flex-direction: column;
        }
        .games-container {
            flex: 1 1 auto;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background: #fff8dceb;
            padding: 6px 24px;
            font-size: 1.3rem;
            line-height: 1.7;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
            user-select: none;
        }
        .games-container::-webkit-scrollbar {
            display: none;
        }
        .games-title {
            text-align: center;
            font-family: 'Castlefire';
            font-size: 36px;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
        }
        .games-headers {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0d0a0;
            margin-bottom: 8px;
        }
        .header-date {
            font-family: 'Castlefire';
            font-size: 20px;
            color: #b23c1a;
            font-weight: bold;
            letter-spacing: 2px;
            flex: 1;
        }
        .header-place {
            font-family: 'Castlefire';
            font-size: 20px;
            color: #b23c1a;
            font-weight: bold;
            letter-spacing: 2px;
            flex: 1;
            text-align: center;
        }
        .header-rating {
            font-family: 'Castlefire';
            font-size: 20px;
            color: #b23c1a;
            font-weight: bold;
            letter-spacing: 2px;
            flex: 1;
            text-align: right;
        }
        .game-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e0d0a0;
        }
        .game-item:last-child {
            border-bottom: none;
        }
        .game-date {
            font-family: 'rusty_typewriter';
            font-size: 32px;
            color: #222;
            flex: 1;
        }
        .game-result {
            font-family: 'rusty_typewriter';
            font-size: 32px;
            flex: 1;
            text-align: center;
        }
        .game-result.win {
            color: #00BA0C;
        }
        .game-result.loss {
            color: #FF0000;
        }
        .game-result.safe {
            color: #ff7b00;
        }
        .game-result.gray {
            color: #666565;
        }
        .game-score {
            font-family: 'rusty_typewriter';
            font-size: 32px;
            color: #222;
            flex: 1;
            text-align: right;
        }
        .back-btn {
            width: 320px;
            height: 90px;
            margin: 40px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            transform-origin: center center;
            will-change: transform;
        }
        .back-btn:hover, .back-btn:focus {
            transform: scale(1.08);
            z-index: 2;
        }
        .back-btn:active {
            transform: scale(0.92);
            transition: transform 0.1s ease-out;
        }
        .back-btn img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            user-select: none;
        }
        .back-btn-text {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Castlefire';
            font-size: 50px;
            color: #222;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
        }
        .icon {
            height: 1.5em;
            vertical-align: middle;
            margin: 0 0.15em 0 0.1em;
            display: inline-block;
        }
        .arrow-mobile {
            display: inline;
        }
        .arrow-desktop {
            display: inline;
        }
        @media (min-width: 2560px)  {
            .logo { width: 320px; }
            .title { font-size: 100px; }
            .greeting { font-size: 50px; }

            .stats { gap: 64px;}
            .stat-icon { width: 120px; height: 120px; }
            .stat-label { font-size: 32px; border-radius: 24px; }
            .stat-value { font-size: 40px; }
            
            .container { max-width: 600px; height: 398px; margin-bottom: 30px; margin-top: 10px;}
            .games-title { font-size: 50px; }
            .header-date, .header-place, .header-rating { font-size: 32px; }
            .arrow-mobile { display: none; }
            
            .back-btn { width: 320px; height: 90px; }
            .back-btn-text { font-size: 50px; }
        }
        @media (min-width: 600px)  {
            .logo { width: 200px; margin-top: 10px; margin-bottom: 20px; }
            .title { font-size: 35px;  }
            .greeting { font-size: 25px; margin: 10px 0 24px 0;}
            
            .stats { gap: 20px; margin-bottom: 16px;}
            .stat-icon { width: 50px; height: 50px; }
            .stat-label { font-size: 18px; border-radius: 16px; }
            .stat-value { font-size: 18px; }
            .arrow-mobile { display: none; }
            .game-date, .game-result, .game-score { font-size: 18px;}
            .container { max-width: 450px; height: 300px; }
            .games-title { font-size: 25px; }
            .header-date, .header-place, .header-rating { font-size: 18px; }        

            .back-btn { margin-top: 10px; width: 250px; height: 70px; }
        
            .back-btn-text { font-size: 35px; }
        }
        @media (min-width: 390px) and (max-width: 599px) { 
            .logo { width: 180px; margin-top: 20px; margin-bottom: 10px; display: none; }
            .title { font-size: 50px; }
            .greeting { font-size: 35px; margin: 12px 0 0 0 ;}

            .stats { gap: 12px; margin-top: 12px; }
            .stat-block { gap: 8px; }
            .stat-icon { width: 70px; height: 70px; margin-bottom: 4px; }
            .stat-label { font-size: 24px; padding: 2px 18px; margin-bottom: 2px; }
            .stat-value { font-size: 32px; margin-bottom: 2px; }

            .container { max-width: 365px; height:300px; padding: 6px 12px;}
            .games-container { max-width: 365px; height: 250px;  padding: 0;}
            .games-title { font-size: 32px; margin-bottom: 0px; }
            .header-date, .header-place, .header-rating { font-size: 24px; }
            .game-date, .game-result, .game-score { font-size: 24px;}
            .arrow-desktop {display: none;}

            .back-btn { margin-top: 24px; width: 240px; height: 60px; }
            .back-btn-text { font-size: 35px; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">Profile</div>
    <div class="greeting">...</div>
    <div class="stats">
        <div class="stat-block">
            <img src="ui-elements/user_games_v3.png" alt="games" class="stat-icon">
            <div class="stat-label">Games</div>
            <div class="stat-value">...</div>
        </div>
        <div class="stat-block">
            <img src="ui-elements/user_rating_v2.png" alt="rating" class="stat-icon">
            <div class="stat-label">Rating</div>
            <div class="stat-value">...</div>
        </div>
        <div class="stat-block">
            <img src="ui-elements/user_wins.png" alt="wins" class="stat-icon">
            <div class="stat-label">Wins</div>
            <div class="stat-value">...</div>
        </div>
    </div>

    
    <div class="container">
        <div class="games-title">Last Games</div>
        <div class="games-headers">
            <div class="header-date">Date</div>
            <div class="header-place">Place</div>
            <div class="header-rating">Rating</div>
        </div>
        <!-- Это для мобилы: ↓ ↑ ⇅ -->
        <!-- Это для ПК    : 🡓 🡑 🡙 -->
        <div class="games-container">
        
        </div>

    <div class="back-btn" onclick="window.location.href='index.html'">
        <img src="ui-elements/svg/red_button.svg" alt="BACK">
        <span class="back-btn-text">BACK</span>
    </div>
    <script src="auth.js" ></script>
    <script src="common.js" ></script>
    <script>
    function pad2(n) { return n < 10 ? '0' + n : n; }
    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1);
    }
    function getArrow(rankDelta, desktop=true) {
        if (rankDelta > 0) return desktop ? '🡑' : '↑';
        if (rankDelta < 0) return desktop ? '🡓' : '↓';
        return desktop ? '🡙' : '⇅';
    }
    function getDeltaClass(rankDelta) {
        if (rankDelta > 0) return 'win';
        if (rankDelta < 0) return 'loss';
        return 'safe';
    }
    document.addEventListener('DOMContentLoaded', async function() {
        if (typeof getBackendUrl !== 'function' || typeof getUserId !== 'function') return;
        try {
            const response = await fetch(getBackendUrl() + '/api/users/history/' + getUserId());
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            // Заменяем {user_name}
            document.querySelectorAll('.greeting').forEach(e => e.textContent = data.login);
            // Статы
            const statBlocks = document.querySelectorAll('.stat-block');
            if (statBlocks.length >= 3) {
                statBlocks[0].querySelector('.stat-value').textContent = data.totalGames ?? 0;
                statBlocks[1].querySelector('.stat-value').textContent = data.rating ?? 0;
                statBlocks[2].querySelector('.stat-value').textContent = data.winGames ?? 0;
            }
            // Игры
            const gamesContainer = document.querySelector('.games-container');
            if (gamesContainer) {
                gamesContainer.innerHTML = '';
                (data.userHistory || []).forEach(game => {
                    // Найти текущего игрока
                    const me = (game.players || []).find(p => p.userId === getUserId());
                    const place = me ? me.place : '';
                    const rankDelta = me ? me.rankDelta : 0;
                    const deltaClass = getDeltaClass(rankDelta);
                    const desktopArrow = getArrow(rankDelta, true);
                    const mobileArrow = getArrow(rankDelta, false);
                    // Формируем блок
                    const item = document.createElement('div');
                    item.className = 'game-item';
                    item.innerHTML = `
                        <div class="game-date">${formatDate(game.endTime)}</div>
                        <div class="game-result">
                            <span class="game-result ${deltaClass}">${place}</span> ୵ <span class="game-result gray">${game.playersCount}</span>
                        </div>
                        <div class="game-score">${rankDelta}<span class="game-result ${deltaClass}">
                            <span class="arrow-desktop"> ${desktopArrow}</span>
                            <span class="arrow-mobile"> ${mobileArrow}</span>
                        </span>
                        </div>
                    `;
                    gamesContainer.appendChild(item);
                });
            }
        } catch (e) {
            // Ошибка — можно показать сообщение или оставить как есть

        }
    });
    </script>
</body>
</html>

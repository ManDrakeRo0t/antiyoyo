<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Login</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <link rel="stylesheet" href="main.css">
    <style> 
        @media (min-width: 390px) { 
            .logo { width: 180px; margin-top: 10px; margin-bottom: 10px; }
            .title { font-size: 50px; }
            .greeting { font-size: 40px; margin: 8px 0 16px 0;}

            .form { gap: 8px;}

            .buttons { gap: 10px; }
            .svg-btn { width: 240px; height: 60px; }
            .svg-btn-text { font-size: 35px; }

            .input-wrapper-new { width: 300px; height: 70px; }
            .input-field-new { font-size: 35px; width: 256px; height: 62px; border-radius: 16px;}
        }
        @media (min-width: 600px) {
            .logo { width: 190px; margin-top: 5px; margin-bottom: 5px;}
            .title { font-size: 60px; }
            .greeting { font-size: 40px; margin: 4px 0 10px 0; }

            .form { gap: 12px;}
            
            .buttons { gap: 12px; }
            .svg-btn { width: 280px; height: 67px; }
            .svg-btn-text { font-size: 40px; }

            .input-wrapper-new { width: 440px; height: 80px; }
            .input-field-new { font-size: 40px; width: 316px; height: 75px; border-radius: 18px; }
        }
        @media (min-width: 2560px) {
            .logo { width: 320px; margin-top: 50px; margin-bottom: 20px; }
            .title { font-size: 100px; }
            .greeting { font-size: 60px; margin: 8px 0 16px 0; }

            .form { gap: 16px;}
            
            .buttons { gap: 16px; }
            .svg-btn { width: 360px; height: 90px; }
            .svg-btn-text { font-size: 50px; }

            .input-wrapper-new { width: 500px; height: 100px; }
            .input-field-new { font-size: 50px; height: 89px; width: 405px; height: 94px; border: 4px solid transparent; border-radius: 24px; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">World Wars</div>
    <div class="greeting">Login</div>
    <form class="form">
        <div class="input-wrapper-new">
            <img src="ui-elements/svg/enter_field.svg" class="input-bg" alt="login-bg">
            <input type="text" id="loginInput" class="input-field-new" placeholder="Name" autocomplete="off">
        </div>
        <div class="input-wrapper-new">
            <img src="ui-elements/svg/enter_field.svg" class="input-bg" alt="password-bg">
            <input type="password" id="passwordInput" class="input-field-new" placeholder="Password" autocomplete="new-password">
        </div>
        <div class="buttons">
            <div class="svg-btn" onclick="handleLoginClick()">
                <img src="ui-elements/svg/yellow_button.svg" alt="ENTER" style="width:100%;height:100%;">
                <span class="svg-btn-text">ENTER</span>
            </div>
            <div class="svg-btn" onclick="window.location.href='register.html'">
                <img src="ui-elements/svg/blue_button.svg" alt="SIGN UP" style="width:100%;height:100%;">
                <span class="svg-btn-text">SIGN UP</span>
            </div>
        </div>
    </form>
    <script src="common.js" ></script>
    <script>

        async function handleLoginClick() {
            const login = document.getElementById('loginInput').value;
            const password = document.getElementById('passwordInput').value;
            try {
                const endpoint = '/api/login';
                const response = await fetch(`${getBackendUrl()}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ login, password })
                });
                if (response.ok) {
                    const userData = await response.json();
                    currentUser = userData;
                    localStorage.setItem('userData', JSON.stringify(userData));
                    window.location.href = "index.html"
                } else {
                    const errorData = await response.json();
                    alert(errorData.message || 'Authentication error');
                }
            } catch (error) {
                console.error('Auth error:', error);
                alert('Connection error');
            }
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars - Login</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <style>
        @font-face {
            font-family: 'Castlefire';
            src: url('fonts/Castlefire.ttf') format('truetype'),
                 url('fonts/Castlefire.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        html{
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100%;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #f0cba3;
            font-family: 'Castlefire';
            user-select: none;
        }
        .logo {
            width: 180px;
            height: auto;
            margin-top: 40px;
            margin-bottom: 20px;
            display: block;
            pointer-events: none;
            user-select: none;
        }
        .title {
            font-family: 'Castlefire';
            font-size: 64px;
            color: #222;
            text-align: center;
            margin: 0;
            line-height: 1;
            user-select: none;
        }
        .greeting {
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            text-align: center;
            margin: 16px 0 32px 0;
            line-height: 1;
            user-select: none;
        }
        .form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-bottom: 40px;
        }
        .input-wrapper {
            position: relative;
            width: 600px;
            height: 100px;
        }
        .input-bg {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0; top: 0;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }
        .input-field {
            position: absolute;
            left: 0; top: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Castlefire';
            font-size: 48px;
            color: #222;
            padding: 0 40px;
            z-index: 2;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .input-field::placeholder {
            color: #a1966d;
            opacity: 1;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .svg-btn {
            width: 200px;
            height: 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
            transform-origin: center center;
            will-change: transform;
        }
        .svg-btn:hover, .svg-btn:focus {
            transform: scale(1.06);
            box-shadow: none;
            z-index: 2;
        }
        .svg-btn:active {
            transform: scale(0.92);
            transition: transform 0.1s ease-out;
        }
        .svg-btn-text {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
            transform: none !important;
        }
        @media (min-width: 2560px) and (max-height: 6560px) {
            .logo { width: 320px; }
            .title { font-size: 100px; }
            .greeting { font-size: 50px; }

            .svg-btn { width: 320px; height: 90px; }
            .svg-btn-text { font-size: 50px; }

            .input-wrapper { width: 480px; height: 100px; }
            .input-field { font-size: 50px;}
        }
        @media (min-width: 600px) and (max-height: 1300px) {
            .logo { width: 300px; }
            .title { font-size: 85px; }
            .greeting { font-size: 45px; }

            .svg-btn { width: 320px; height: 80px; }
            .svg-btn-text { font-size: 45px; }

            .input-wrapper { width: 440px; height: 90px; }
            .input-field { font-size: 45px;}
            
        }
        @media (min-width: 390px) and (max-height: 932px) { 
            .logo { width: 180px; margin-top: 20px; margin-bottom: 10px; }
            .title { font-size: 50px; }
            .greeting { font-size: 35px; margin: 6px 0 6px 0;}

            .form { gap: 6px;}

            .buttons { gap: 12px; }
            .svg-btn { width: 240px; height: 60px; }
            .svg-btn-text { font-size: 35px; }

            .input-wrapper { width: 300px; height: 75px; }
            .input-field { font-size: 35px;}
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">World Wars</div>
    <div class="greeting">Welcome!</div>
    <form class="form">
        <div class="input-wrapper">
            <img src="ui-elements/svg/enter_field.svg" class="input-bg" alt="login-bg">
            <input type="text" id="loginInput" class="input-field" placeholder="Login" autocomplete="username">
        </div>
        <div class="input-wrapper">
            <img src="ui-elements/svg/enter_field.svg" class="input-bg" alt="password-bg">
            <input type="password" id="passwordInput" class="input-field" placeholder="Password" autocomplete="current-password">
        </div>
        <div class="buttons">
            <div class="svg-btn" onclick="handleLoginClick()">
                <img src="ui-elements/svg/yellow_button.svg" alt="ENTER" style="width:100%;height:100%;pointer-events:none;user-select:none;">
                <span class="svg-btn-text">ENTER</span>
            </div>
            <div class="svg-btn" onclick="window.location.href='register.html'"">
                <img src="ui-elements/svg/blue_button.svg" alt="SIGN UP" style="width:100%;height:100%;pointer-events:none;user-select:none;">
                <span class="svg-btn-text">SIGN UP</span>
            </div>
        </div>
    </form>
    <script src="common.js" ></script>
    <script>

        async function handleLoginClick() {
            const login = document.getElementById('loginInput').value;
            const password = document.getElementById('passwordInput').value;
            try {
                const endpoint = '/api/login';
                const response = await fetch(`${getBackendUrl()}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ login, password })
                });
                if (response.ok) {
                    const userData = await response.json();
                    currentUser = userData;
                    localStorage.setItem('userData', JSON.stringify(userData));
                    window.location.href = "index.html"
                } else {
                    const errorData = await response.json();
                    alert(errorData.message || 'Authentication error');
                }
            } catch (error) {
                console.error('Auth error:', error);
                alert('Connection error');
            }
        }

    </script>
</body>
</html>

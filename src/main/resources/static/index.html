<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <link rel="stylesheet" href="main.css">
    <style>
        .bottom-buttons {
            display: flex;
            gap: 60px;
            margin-top: 60px;
        }
        .circle-btn {
            width: 222px;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            will-change: transform;
        }
        .circle-btn:hover, .circle-btn:focus {
            transform: scale(1.14);
        }
        .circle-btn:active {
            transform: scale(0.94);
        }
        /* toDo 
        над заимплементить с Maps: 
        1. modal-bg
        2. закрытие поп-апа нажатием вне поп-апа  */
        #watchModal.modal-container {
            position: fixed;
            left: 50%;
            top: 50%;
            background-color: #fff8dc;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.18);
            width: 450px;
            border-radius: 24px;
            padding: 24px;
        }
        .icon-pop-up {
            width: 145px; 
            margin-bottom: 24px;
            pointer-events: none; 
        }
        .pop-up-description {
            font-family: 'Castlefire'; 
            text-align: center;
            font-size: 40px; 
            color: #222; 
            line-height: 1;
            margin-bottom: 24px;
        }
        .app-version {
            font-family: rusty_typewriter;
            text-align: center;
        }
        @media (min-width: 390px) { 
            .logo { width: 180px; margin-top: 10px; margin-bottom: 10px; }
            .title { font-size: 50px; }
            .greeting { font-size: 40px; margin: 8px 0 16px 0;}

            .buttons { gap: 12px; }
            .svg-btn { width: 240px; height: 60px; }
            .svg-btn-text { font-size: 35px; }
            .app-version { font-size: 24px; margin-top: 12px; display: none; }

            .bottom-buttons { gap: 25px; margin-top: 20px;}
            .circle-btn { width: 60px; height: 60px; }

            #watchModal.modal-container { width: 340px; top: 58%; padding: 16px; }
            .icon-pop-up { width: 90px;  margin-bottom: 16px; }
            .pop-up-description { font-size: 30px; margin-bottom: 16px; line-height: 1.2; }
        }
        @media (min-width: 600px) {
            .logo { width: 190px; margin-top: 5px; margin-bottom: 5px;}
            .title { font-size: 60px; }
            .greeting { font-size: 40px; margin: 4px 0 10px 0; }

            .buttons { gap: 12px; }
            .svg-btn { width: 280px; height: 67px; }
            .svg-btn-text { font-size: 40px; }
            .app-version { font-size: 24px; margin-top: 12px; display: flex; }
            
            .bottom-buttons { gap: 27px; margin-top: 16px;}
            .circle-btn { width: 67px; height: 67px; }

            #watchModal.modal-container { width: 360px; top: 58.5%; padding: 16px; }
            .icon-pop-up { width: 100px;  margin-bottom: 16px; }
            .pop-up-description { font-size: 35px; margin-bottom: 16px; line-height: 1.2; }
        }
        @media (min-width: 2560px) {
            .logo { width: 320px; margin-top: 50px; margin-bottom: 20px; }
            .title { font-size: 100px; }
            .greeting { font-size: 60px; margin: 12px 0 24px 0; }

            .buttons { gap: 24px; }
            .svg-btn { width: 360px; height: 90px; }
            .svg-btn-text { font-size: 50px; }

            .bottom-buttons { gap: 60px; margin-top: 50px; }
            .circle-btn { width: 90px; height: 90px; }
            .app-version { font-size: 40px; margin-top: 50px;}

            #watchModal.modal-container { width: 500px; top: 56%; padding: 24px; }
            .icon-pop-up { width: 145px;  margin-bottom: 24px; }
            .pop-up-description { font-size: 40px; margin-bottom: 24px; line-height: normal; }
        }
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" class="logo">
    <div class="title">World Wars</div>
    <div class="greeting">Hello, <span id="menuUserLogin">...</span>!</div>
    <div class="buttons">
        <div class="svg-btn" onclick="handlePlay()">
            <img src="ui-elements/svg/yellow_button.svg" alt="PLAY" style="width:100%;height:100%;">
            <span class="svg-btn-text">PLAY</span>
        </div>
        <div class="svg-btn" onclick="window.location.href='maps.html'">
            <img src="ui-elements/svg/blue_button.svg" alt="LOBBIES" style="width:100%;height:100%;">
            <span class="svg-btn-text">LOBBIES</span>
        </div>
        <div class="svg-btn" onclick="window.location.href='redactor.html'">
            <img src="ui-elements/svg/blue_button.svg" alt="RANKING" style="width:100%;height:100%;">
            <span class="svg-btn-text">CREATE</span>
        </div>
        <div class="svg-btn" onclick="window.location.href='account.html'">
            <img src="ui-elements/svg/blue_button.svg" alt="ACCOUNT" style="width:100%;height:100%;">
            <span class="svg-btn-text">ACCOUNT</span>
        </div>
        <div class="svg-btn" onclick="leave()">
            <img src="ui-elements/svg/red_button.svg" alt="LEAVE" style="width:100%;height:100%;">
            <span class="svg-btn-text">LEAVE</span>
        </div>
    </div>
    <div class="bottom-buttons">
        <img src="ui-elements/svg/rules_button.svg" alt="rules" class="circle-btn" onclick="window.location.href='rules.html'">
        <img src="ui-elements/svg/ratings_button.svg" alt="dollar" class="circle-btn"  onclick="window.location.href='ratings.html'" >
        <img src="ui-elements/svg/settings_button.svg" alt="settings" class="circle-btn" onclick="window.location.href='settings.html'">
    </div>
    <div class="app-version">v1.12.0</div>
    <div class="modal-container" id="watchModal" style="display: none;">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <img src="ui-elements/warning_v1.png" class="icon-pop-up"/>
            <div class="pop-up-description">You have ongoing active session!</div>
            <div class="buttons">
                <button class="svg-btn" id="watchMainBtn" onclick="connectToActiveSssion()">
                    <img src="ui-elements/svg/yellow_button.svg" style="width:100%;height:100%;">
                    <span class="svg-btn-text">JOIN</span>
                </button>
                <button class="svg-btn" id="watchWatchBtn" onclick="window.location.href='play.html'">
                    <img src="ui-elements/svg/blue_button.svg" style="width:100%;height:100%;">
                    <span class="svg-btn-text">SKIP</span>
                </button>
            </div>
        </div>
    </div>
    <script src="common.js" ></script>
    <script src="auth.js"></script>
    <script>
        
        activeSessionId = null;

        function connectToActiveSssion() {
            window.location.href = `game.html?session=${activeSessionId}`;
        }

        async function handlePlay() {
            
            const response = await fetch(`${getBackendUrl()}/api/users/${currentUser.id}/active-session`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    activeSessionId = await response.json();
                    document.getElementById("watchModal").style.display = 'block'
                } else {
                    window.location.href='play.html'
                }
        }

        if (currentUser) {
            const menuUserLogin = document.getElementById('menuUserLogin');
            if (menuUserLogin) menuUserLogin.textContent = currentUser.login;
        }

        function leave() {
            localStorage.removeItem("userData")
            window.location.href='login.html'
        }

    </script>
</body>
</html>

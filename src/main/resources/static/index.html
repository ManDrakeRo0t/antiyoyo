<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars</title>
    <style>
        @font-face {
            font-family: 'Castlefire';
            src: url('fonts/Castlefire.ttf') format('truetype'),
                 url('fonts/Castlefire.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 30%, #F0CCA5 0%, #FDEBD4 100%);
            font-family: 'Castlefire', sans-serif;
            overflow: hidden;
        }
        .centered-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .auth-modal, .main-menu {
            width: 100%;
            max-width: 370px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            box-sizing: border-box;
        }
        .game-logo {
            width: 90px;
            height: auto;
            margin-top: 32px;
            margin-bottom: 8px;
        }
        .game-title {
            font-size: 2.2rem;
            color: #222;
            text-align: center;
            margin: 0 0 8px 0;
            letter-spacing: 2px;
        }
        .menu-welcome, .menu-user-login {
            font-size: 1.1rem;
            color: #222;
            text-align: center;
            margin-bottom: 16px;
        }
        /* Auth */
        .auth-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .auth-container h3 {
            font-size: 1.2rem;
            margin: 8px 0 16px 0;
        }
        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .auth-form input {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 12px;
            background: #fff;
            font-family: 'Castlefire', sans-serif;
            font-size: 1.1rem;
            color: #222;
            text-align: center;
            box-sizing: border-box;
        }
        .auth-form input::placeholder {
            color: #888;
        }
        .auth-form input:focus {
            outline: 2px solid #e0b97d;
        }
        .auth-form button {
            position: relative;
            width: 100%;
            height: 48px;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: 'Castlefire', sans-serif;
            font-size: 1.2rem;
            color: #222;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 4px;
            padding: 0;
        }
        .auth-form button .button-bg {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            z-index: 1;
            object-fit: cover;
            pointer-events: none;
        }
        .auth-form button .button-text {
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        .auth-switch {
            width: 100%;
            margin-top: 8px;
            display: flex;
            justify-content: center;
        }
        .auth-switch button {
            position: relative;
            background: none;
            border: none;
            color: #222;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
            height: 40px;
            border-radius: 16px;
            overflow: hidden;
            padding: 0;
        }
        .auth-switch button .button-bg {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            z-index: 1;
            object-fit: cover;
            pointer-events: none;
        }
        .auth-switch button .button-text {
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        .auth-error {
            color: #f44336;
            text-align: center;
            margin-top: 4px;
            font-size: 0.95rem;
        }
        /* Main menu */
        .menu-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 24px 0 16px 0;
        }
        .menu-button {
            position: relative;
            width: 100%;
            height: 54px;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: 'Castlefire', sans-serif;
            font-size: 1.3rem;
            color: #222;
            border-radius: 16px;
            overflow: hidden;
            padding: 0;
        }
        .menu-button .button-bg {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            z-index: 1;
            object-fit: cover;
            pointer-events: none;
        }
        .menu-button .button-text {
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        .menu-button:active, .auth-form button:active, .menu-icon-button:active {
            filter: brightness(0.92);
        }
        .menu-icons {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            gap: 12px;
        }
        .menu-icon-button {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.1s;
        }
        .menu-icon-button img {
            width: 38px;
            height: 38px;
        }
        /* Адаптивность */
        @media (max-width: 600px) {
            .centered-wrapper {
                padding: 0 4vw;
            }
            .auth-modal, .main-menu {
                max-width: 98vw;
            }
            .game-logo {
                width: 64px;
            }
            .menu-button, .auth-form button {
                font-size: 1.05rem;
                height: 44px;
            }
            .menu-button .button-bg, .auth-form button .button-bg {
                height: 44px;
            }
            .menu-icon-button {
                width: 38px;
                height: 38px;
            }
            .menu-icon-button img {
                width: 28px;
                height: 28px;
            }
        }
        @media (min-width: 900px) {
            .centered-wrapper {
                min-height: 100vh;
                justify-content: center;
                align-items: center;
            }
            .auth-modal, .main-menu {
                max-width: 370px;
                box-shadow: 0 2px 16px 0 rgba(0,0,0,0.07);
                border-radius: 24px;
                background: rgba(255,255,255,0.04);
                padding: 32px 32px 24px 32px;
            }
        }
    </style>
</head>
<body>
    <div class="centered-wrapper">
        <!-- Authentication Modal -->
        <div id="authModal" class="auth-modal" style="display: none;">
            <div class="auth-container">
                <img src="ui-elements/logo.png" alt="World Wars Logo" class="game-logo">
                <h2 class="game-title">World Wars</h2>
                <h3 id="authTitle">Log in</h3>
                <form class="auth-form" id="authForm">
                    <input type="text" id="loginInput" placeholder="Login" required>
                    <input type="password" id="passwordInput" placeholder="Password" required>
                    <button type="submit" id="authSubmitBtn" class="enter-button">
                        <img class="button-bg" src="ui-elements/svg/yellow_button.svg" alt="Enter" />
                        <span class="button-text">ENTER</span>
                    </button>
                    <div class="auth-error" id="authError" style="display: none;"></div>
                </form>
                <div class="auth-switch">
                    <button type="button" id="authSwitchButton" class="signup-button">
                        <img class="button-bg" src="ui-elements/svg/gray_button.svg" alt="Sign up" />
                        <span class="button-text">SIGN UP</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- Main Menu -->
        <div id="mainMenu" class="main-menu" style="display: none;">
            <img src="ui-elements/logo.png" alt="World Wars Logo" class="game-logo">
            <h1 class="game-title">World Wars</h1>
            <div class="menu-welcome" id="menuWelcome">
                <span class="welcome-text">Hello, <span id="menuUserLogin"></span>!</span>
            </div>
            <div class="menu-buttons">
                <button class="menu-button" id="playButton">
                    <img class="button-bg" src="ui-elements/svg/yellow_button.svg" alt="Play" />
                    <span class="button-text">PLAY</span>
                </button>
                <button class="menu-button" id="lobbiesButton">
                    <img class="button-bg" src="ui-elements/svg/blue_button.svg" alt="Lobbies" />
                    <span class="button-text">LOBBIES</span>
                </button>
                <button class="menu-button" id="rankingButton">
                    <img class="button-bg" src="ui-elements/svg/blue_button.svg" alt="Ranking" />
                    <span class="button-text">REDACTOR</span>
                </button>
                <button class="menu-button" id="accountButton">
                    <img class="button-bg" src="ui-elements/svg/blue_button.svg" alt="Account" />
                    <span class="button-text">ACCOUNT</span>
                </button>
                <button class="menu-button" id="leaveButton">
                    <img class="button-bg" src="ui-elements/svg/red_button.svg" alt="Leave" />
                    <span class="button-text">LEAVE</span>
                </button>
            </div>
            <div class="menu-icons">
                <button class="menu-icon-button" id="questionIcon">
                    <img src="ui-elements/svg/rules_button.svg" alt="Rules" />
                </button>
                <button class="menu-icon-button" id="dollarIcon">
                    <img src="ui-elements/svg/dollar_button.svg" alt="Shop" />
                </button>
                <button class="menu-icon-button" id="settingsIcon">
                    <img src="ui-elements/svg/settings_button.svg" alt="Settings" />
                </button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"></script>
    <script>
        // Backend host management
        let backendHost = window.location.hostname;
    
        // Initialize backend host from localStorage
        function initializeBackendHost() {
            const storedHost = localStorage.getItem('backendHost');
            if (!storedHost) {
                currentHost = window.location.hostname;
                localStorage.setItem('backendHost', currentHost);
                backendHost = currentHost;
            } else {
                backendHost = storedHost;
            }
        }

        // Get backend URL for API calls
        function getBackendUrl() {
            return `http://${backendHost}:8080`;
        }

        // Initialize backend host on page load
        initializeBackendHost();

        // Authentication and localStorage management
        let currentUser = null;
        let isAuthMode = false; // true for register, false for login

        // Check if user is logged in on page load
        function checkAuthStatus() {
            const userData = localStorage.getItem('userData');
            if (userData) {
                try {
                    currentUser = JSON.parse(userData);
                    showMainMenu();
                    updateUserInfo();
                } catch (e) {
                    console.error('Error parsing user data:', e);
                    localStorage.removeItem('userData');
                    showAuthModal();
                }
            } else {
                showAuthModal();
            }
        }

        // Show authentication modal
        function showAuthModal() {
            const authModal = document.getElementById('authModal');
            const mainMenu = document.getElementById('mainMenu');
            
            if (authModal) authModal.style.display = 'flex';
            if (mainMenu) mainMenu.style.display = 'none';
            
            resetAuthForm();
        }

        // Show main menu
        function showMainMenu() {
            const authModal = document.getElementById('authModal');
            const mainMenu = document.getElementById('mainMenu');
            
            if (authModal) authModal.style.display = 'none';
            if (mainMenu) mainMenu.style.display = 'flex';
        }

        // Show game interface (not used directly for main menu, but kept for context)
        function showGameInterface() {
            // This function is likely for switching to the game.html
            // For now, it won't do anything here as the game is on a separate page.
            console.log("Switching to game interface (not implemented in index.html)");
        }

        // Reset authentication form
        function resetAuthForm() {
            const authForm = document.getElementById('authForm');
            const authError = document.getElementById('authError');
            
            if (authForm) authForm.reset();
            if (authError) authError.style.display = 'none';
            updateAuthUI();
        }

        // Update authentication UI based on mode
        function updateAuthUI() {
            const title = document.getElementById('authTitle');
            const submitBtn = document.getElementById('authSubmitBtn');
            const switchBtn = document.getElementById('authSwitchButton');

            if (isAuthMode) {
                if (title) title.textContent = 'REGISTRATION';
                if (submitBtn) {
                    submitBtn.querySelector('.button-text').textContent = 'ENTER';
                    submitBtn.querySelector('.button-bg').src = 'ui-elements/svg/yellow_button.svg';
                }
                if (switchBtn) {
                    switchBtn.querySelector('.button-text').textContent = 'BACK';
                    switchBtn.querySelector('.button-bg').src = 'ui-elements/svg/orange_button.svg';
                }
            } else {
                if (title) title.textContent = 'SIGN IN';
                if (submitBtn) {
                    submitBtn.querySelector('.button-text').textContent = 'ENTER';
                    submitBtn.querySelector('.button-bg').src = 'ui-elements/svg/yellow_button.svg';
                }
                if (switchBtn) {
                    switchBtn.querySelector('.button-text').textContent = 'SIGN UP';
                    switchBtn.querySelector('.button-bg').src = 'ui-elements/svg/gray_button.svg';
                }
            }
        }

        // Switch between login and register modes
        function switchAuthMode() {
            isAuthMode = !isAuthMode;
            updateAuthUI();
            resetAuthForm();
        }

        // Handle authentication form submission
        async function handleAuthSubmit(event) {
            event.preventDefault();
            
            const loginInput = document.getElementById('loginInput');
            const passwordInput = document.getElementById('passwordInput');
            const submitBtn = document.getElementById('authSubmitBtn');
            const errorDiv = document.getElementById('authError');

            if (!loginInput || !passwordInput || !submitBtn || !errorDiv) {
                console.error('Required authentication elements not found');
                return;
            }

            const login = loginInput.value;
            const password = passwordInput.value;

            if (!login || !password) {
                showAuthError('Пожалуйста, заполните все поля');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.querySelector('.button-text').textContent = 'Загрузка...';
            errorDiv.style.display = 'none';

            try {
                const endpoint = isAuthMode ? '/api/register' : '/api/login';
                const response = await fetch(`${getBackendUrl()}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ login, password })
                });

                if (response.ok) {
                    const userData = await response.json();
                    currentUser = userData;
                    localStorage.setItem('userData', JSON.stringify(userData));
                    showMainMenu();
                    updateUserInfo();
                } else {
                    const errorData = await response.json();
                    showAuthError(errorData.message || 'Ошибка аутентификации');
                }
            } catch (error) {
                console.error('Auth error:', error);
                showAuthError('Ошибка соединения с сервером');
            } finally {
                submitBtn.disabled = false;
                updateAuthUI();
            }
        }

        // Show authentication error
        function showAuthError(message) {
            const errorDiv = document.getElementById('authError');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
        }

        // Update user info display
        function updateUserInfo() {
            if (currentUser) {
                const menuUserLogin = document.getElementById('menuUserLogin');
                
                if (menuUserLogin) menuUserLogin.textContent = currentUser.login;
            }
        }

        // Logout function
        function logout() {
            currentUser = null;
            localStorage.removeItem('userData');
            showAuthModal();
        }

        // Menu functions
        function openEditor() {
            window.location.href = 'redactor.html';
        }

        function openGame() {
            window.location.href = 'game.html';
        }

        function createRoom() {
            window.location.href = 'maps.html';
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            // Add authentication event listeners
            const authForm = document.getElementById('authForm');
            const authSwitchButton = document.getElementById('authSwitchButton');

            if (authForm) {
                authForm.addEventListener('submit', handleAuthSubmit);
            }
            if (authSwitchButton) {
                authSwitchButton.addEventListener('click', switchAuthMode);
            }

            // Check authentication status on page load
            checkAuthStatus();

            // Link new menu buttons to existing functions
            document.getElementById('playButton').addEventListener('click', openGame);
            document.getElementById('lobbiesButton').addEventListener('click', createRoom);
            document.getElementById('rankingButton').addEventListener('click', function() { 
                openEditor()
             });
            document.getElementById('accountButton').addEventListener('click', function() { alert('Account clicked!'); });
            document.getElementById('leaveButton').addEventListener('click', logout);

            // Link new icon buttons
            document.getElementById('questionIcon').addEventListener('click', function() {
                window.location.href = 'rules.html';
            });
            document.getElementById('dollarIcon').addEventListener('click', function() { alert('Shop clicked!'); });
            document.getElementById('settingsIcon').addEventListener('click', function() { alert('Settings clicked!'); });
        });
    </script>
</body>
</html>

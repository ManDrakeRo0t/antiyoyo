<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wars</title>
    <link rel="icon" type="image/png" href="ui-elements/icon.png">
    <style>
        @font-face {
            font-family: 'Castlefire';
            src: url('fonts/Castlefire.ttf') format('truetype'),
                 url('fonts/Castlefire.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        html {
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100%; /*???*/
            margin: 0; /*???*/
            box-sizing: border-box; /*???*/
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: flex-start; /*???*/
            background: #f0cba3;
            font-family: 'Castlefire'; /*???*/
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .logo {
            width: 180px;
            height: auto; /*???*/
            margin-top: 40px;
            margin-bottom: 20px;
            display: block; /*???*/
            pointer-events: none;
            user-select: none;
        }
        .title {
            font-family: 'Castlefire';
            font-size: 64px;
            color: #222;
            text-align: center; /*???*/
            margin: 0; /*???*/
            line-height: 1;
            user-select: none;
        }
        .greeting {
            font-family: 'Castlefire';
            font-size: 32px;
            color: #222;
            text-align: center; /*???*/
            margin: 16px 0 32px 0;
            line-height: 1;
            user-select: none;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center; /*???*/
            gap: 24px; 
        }
        .svg-btn {
            width: 650px;
            height: 222px;
            position: relative; /*???*/
            display: flex;
            align-items: center; /*???*/
            justify-content: center; /*???*/
            cursor: pointer; /*???*/
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            transform-origin: center center;
            will-change: transform;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .svg-btn:hover, .svg-btn:focus {
            transform: scale(1.08);
            box-shadow: none;
            z-index: 2;
        }
        .svg-btn:active {
            transform: scale(0.98);
        }
        .svg-btn-text {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Castlefire';
            font-size: 100px;
            color: #222;
            pointer-events: none;
            letter-spacing: 2px;
            user-select: none;
            transform: none !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        .bottom-buttons {
            display: flex;
            flex-direction: row;
            gap: 60px;
            margin-top: 60px;
            justify-content: center;
        }
        .circle-btn {
            width: 222px;
            height: 222px;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            user-select: none;
            transform-origin: center center;
            will-change: transform;
        }
        .circle-btn:hover, .circle-btn:focus {
            transform: scale(1.12);
            box-shadow: none;
            z-index: 2;
        }
        .circle-btn:active {
            transform: scale(0.96);
        }
        #watchModal.modal-container {
            position: fixed;
            left: 50%;
            top: 50%;
            background-color: #f0cba3;
            transform: translate(-50%, -50%);
            z-index: 3000;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.18);
            min-width: 340px;
            max-width: 95vw;
            margin: 0;
            border-radius: 20px;
            padding: 20px;
        }
        .icon-pop-up {
            width: 145px; 
            margin-bottom: 18px; 
        }
        .svg-btn-yellow, .svg-btn-blue {
            width: 200px; 
            height: 65px;            
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            transform-origin: center center;
            will-change: transform;
            background: none;
            border: none;
        }
        .pop-up-description {
            font-family: 'Castlefire', sans-serif; 
            text-align: center;
            font-size: 1.75rem; 
            color: #222; 
            margin-bottom: 24px;
        }
        * {
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
        }
        @media (min-width: 2560px) and (max-height: 6560px) {
            .logo { width: 320px; margin-top: 40px; margin-bottom: 20px; }
            .title { font-size: 100px; }
            .greeting { font-size: 50px; margin: 16px 0 32px 0;}

            .buttons { gap: 24px; }
            .svg-btn { width: 360px; height: 90px; }
            .svg-btn-text { font-size: 50px; }

            .bottom-buttons { gap: 60px; margin-top: 60px;}
            .circle-btn { width: 90px; height: 90px; }
        }
        @media (min-width: 600px) and (max-height: 1300px) {
            .logo { width: 300px; margin-top: 40px; margin-bottom: 20px; }
            .title { font-size: 85px; }
            .greeting { font-size: 45px; margin: 16px 0 24px 0;}

            .buttons { gap: 16px; }
            .svg-btn { width: 320px; height: 80px; }
            .svg-btn-text { font-size: 45px; }

            .bottom-buttons { gap: 35px; margin-top: 35px;}
            .circle-btn { width: 80px; height: 80px; }
        }
        @media (min-width: 390px) and (max-height: 932px) { 
            .logo { width: 180px; margin-top: 20px; margin-bottom: 10px; }
            .title { font-size: 50px; }
            .greeting { font-size: 35px; margin: 6px 0 10px 0;}

            .buttons { gap: 12px; }
            .svg-btn { width: 240px; height: 60px; }
            .svg-btn-text { font-size: 35px; }

            .bottom-buttons { gap: 25px; margin-top: 20px;}
            .circle-btn { width: 60px; height: 60px; }
        }

        
    </style>
</head>
<body>
    <img src="ui-elements/logo.png" alt="logo" class="logo">
    <div class="title">World Wars</div>
    <div class="greeting">Hello, <span id="menuUserLogin">...</span>!</div>
    <div class="buttons">
        <div class="svg-btn" onclick="handlePlay()">
            <img src="ui-elements/svg/yellow_button.svg" alt="PLAY" style="width:100%;height:100%;pointer-events:none;user-select:none;">
            <span class="svg-btn-text">PLAY</span>
        </div>
        <div class="svg-btn" onclick="window.location.href='maps.html'">
            <img src="ui-elements/svg/blue_button.svg" alt="LOBBIES" style="width:100%;height:100%;pointer-events:none;user-select:none;">
            <span class="svg-btn-text">LOBBIES</span>
        </div>
        <div class="svg-btn" onclick="window.location.href='redactor.html'">
            <img src="ui-elements/svg/blue_button.svg" alt="RANKING" style="width:100%;height:100%;pointer-events:none;user-select:none;">
            <span class="svg-btn-text">CREATE</span>
        </div>
        <div class="svg-btn" onclick="window.location.href='account.html'">
            <img src="ui-elements/svg/blue_button.svg" alt="ACCOUNT" style="width:100%;height:100%;pointer-events:none;user-select:none;">
            <span class="svg-btn-text">ACCOUNT</span>
        </div>
        <div class="svg-btn" onclick="leave()">
            <img src="ui-elements/svg/red_button.svg" alt="LEAVE" style="width:100%;height:100%;pointer-events:none;user-select:none;">
            <span class="svg-btn-text">LEAVE</span>
        </div>
    </div>
    <div class="bottom-buttons">
        <img src="ui-elements/svg/rules_button.svg" alt="rules" class="circle-btn" onclick="window.location.href='rules.html'">
        <img src="ui-elements/svg/ratings_button.svg" alt="dollar" class="circle-btn"  onclick="window.location.href='ratings.html'" >
        <img src="ui-elements/svg/settings_button.svg" alt="settings" class="circle-btn" onclick="window.location.href='settings.html'">
    </div>
    <div class="modal-container" id="watchModal" style="display: none;">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <img src="ui-elements/warning.png" class="icon-pop-up"/>
                <div class="pop-up-description">You have ongoing active session!</div>
                <div style="display: flex; flex-direction: row; gap: 16px; justify-content: center;">
                    <button class="svg-btn-yellow" id="watchMainBtn" onclick="connectToActiveSssion()" style="display: flex; align-items: center; justify-content: center;">
                        <img src="ui-elements/svg/yellow_button.svg"style="width:100%;height:100%;pointer-events:none;user-select:none;">
                        <span class="svg-btn-text">Join</span>
                    </button>
                </div>
                <button class="svg-btn-blue" id="watchWatchBtn" onclick="window.location.href='play.html'" style="display: flex; align-items: center; justify-content: center; margin-top: 18px; width: 100%;">
                    <img src="ui-elements/svg/red_button.svg" style="width:100%;height:100%;pointer-events:none;user-select:none;">
                    <span class="svg-btn-text">Skip</span>
                </button>
            </div>
        </div>
    <script src="common.js" ></script>
    <script src="auth.js"></script>
    <script>
        
        activeSessionId = null;

        function connectToActiveSssion() {
            window.location.href = `game.html?session=${activeSessionId}`;
        }

        async function handlePlay() {
            
            const response = await fetch(`${getBackendUrl()}/api/users/${currentUser.id}/active-session`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    activeSessionId = await response.json();
                    document.getElementById("watchModal").style.display = 'block'
                } else {
                    window.location.href='play.html'
                }
        }

        if (currentUser) {
            const menuUserLogin = document.getElementById('menuUserLogin');
            if (menuUserLogin) menuUserLogin.textContent = currentUser.login;
        }

        function leave() {
            localStorage.removeItem("userData")
            window.location.href='login.html'
        }

    </script>
</body>
</html>

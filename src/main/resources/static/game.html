<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hexagon Grid Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0-beta2/bundles/stomp.umd.min.js"></script>
    <style>
        @font-face {
            font-family: 'Castlefire';
            src: url('fonts/Castlefire.ttf') format('truetype'),
                 url('fonts/Castlefire.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: 'Castlefire', sans-serif; /* Apply Castlefire font */
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: white;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
        }
        #sessionInput {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease;
        }
        #sessionInput.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #sessionInput input {
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 300px;
        }
        #sessionInput button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #sessionInput button:hover {
            background-color: #45a049;
        }
        #sessionInput button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #connectionStatus {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
        }
        #topRightPanel { /* This panel will be removed from here, styles moved to controlPanel */
            display: none; /* Hide the old panel */
        }
        .action-button { /* These styles will be refined for new icon buttons */
            width: 40px; /* Reduced to match image */
            height: 40px; /* Reduced to match image */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 5px; /* Adjusted to be slightly rounded rectangular */
            background-color: #F7E5A7; /* Match controlPanel background */
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .action-button:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .connected {
            background-color: #4CAF50;
            color: white;
        }
        .disconnected {
            background-color: #f44336;
            color: white;
        }
        #controlPanel {
            position: fixed;
            bottom: 80px; /* Adjusted to make space for actionButtonsPanel */
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 15px;
            background-color: #F7E5A7;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex; /* Always flex */
            gap: 15px; /* Gap between unit buttons and action buttons */
            align-items: center;
            justify-content: center; /* Center unit buttons */
            width: auto; /* Adjust width dynamically */
            min-width: 300px;
            max-width: 90vw;
            box-sizing: border-box;
        }
        .unit-buttons-container { /* New container for unit buttons */
            display: flex;
            gap: 15px;
            align-items: center;
            overflow-x: auto; /* Добавлено для горизонтального скролла */
            white-space: nowrap; /* Кнопки в одну строку */
            padding-bottom: 4px; /* Для видимости скролла */
            scrollbar-width: thin;
            scrollbar-color: #d4af37 #F7E5A7;
            max-width: 90vw; /* Не выходить за экран */
        }
        .unit-buttons-container::-webkit-scrollbar {
            height: 8px;
        }
        .unit-buttons-container::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }
        .unit-buttons-container::-webkit-scrollbar-track {
            background: #F7E5A7;
        }
        .unit-button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .unit-price {
            font-size: 12px;
            text-align: center;
            font-weight: bold;
        }
        .unit-price.affordable {
            color: #4CAF50;  /* Зеленый цвет для доступных юнитов */
        }
        .unit-price.unaffordable {
            color: #f44336;  /* Красный цвет для недоступных юнитов */
        }
        .unit-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #F7E5A7;
            transition: all 0.3s ease;
        }
        .unit-button:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .unit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .unit-button.selected {
            background-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        #BIG_TOWER_Btn { background-image: url('images/big_tower.png'); }
        #TOWER_Btn { background-image: url('images/tower.png'); }
        #FACTORY_Btn { background-image: url('images/factory.png'); }
        #FOREST_FARM_Btn { background-image: url('images/forest-farm.png'); }
        #MINE_FARM_Btn { background-image: url('images/mine-farm.png'); }
        #UNIT_1_Btn { background-image: url('images/unit1.png'); }
        #UNIT_2_Btn { background-image: url('images/unit2.png'); }
        #UNIT_3_Btn { background-image: url('images/unit3.png'); }
        #TANK_Btn { background-image: url('images/tank.png'); }
        #TOWN_HALL_Btn { background-image: url('images/town-hall.png'); }
        #undoBtn { background-image: url('ui-elements/undo-move.svg'); }
        #endTurnBtn { background-image: url('ui-elements/end-turn.svg'); }
        #DRONE_Btn { background-image: url('images/drone.png'); }

        #balanceDisplay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            padding: 10px 15px; /* Adjusted padding */
            background-color: #F7E5A7; /* Match controlPanel background */
            border-radius: 10px; /* Match controlPanel border-radius */
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }
        #balanceDisplay.visible {
            display: flex; /* Changed from block to flex */
        }
        .balance-icon {
            width: 30px; /* Size of the dollar icon */
            height: 30px;
            background-image: url('ui-elements/income.png'); /* Changed to income.png */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .tree-icon {
            width: 30px; /* Size of the dollar icon */
            height: 30px;
            background-image: url('ui-elements/tree.png'); /* Changed to income.png */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .stone-icon {
            width: 30px; /* Size of the dollar icon */
            height: 30px;
            background-image: url('ui-elements/stone.png'); /* Changed to income.png */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .balance-amount {
            /* Text for balance amount, inherits styles from #balanceDisplay */
        }
        .balance-change {
            font-size: 0.8em;
            margin-left: 10px;
        }
        .balance-change.positive {
            color: #4CAF50;
        }
        .balance-change.negative {
            color: #f44336;
        }
        /* Waiting for players styles */
        .waiting-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .waiting-content {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
        }
        .waiting-title {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }
        .waiting-info {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #666;
        }
        .player-count {
            font-weight: bold;
            color: #4CAF50;
        }
        /* Color selection panel */
        .color-selection-panel {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .color-selection-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
            color: #333;
        }
        .color-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .color-select-button {
            width: 60px;
            height: 60px;
            border: 3px solid #333;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .color-select-button:hover {
            transform: scale(1.1);
            border-color: #4CAF50;
        }
        .color-select-button.selected {
            border-color: #4CAF50;
            border-width: 4px;
        }
        .color-select-button::after {
            content: attr(data-color);
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #333;
            white-space: nowrap;
        }
        .join-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .join-button:hover {
            background-color: #45a049;
        }
        .join-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        .bouncing-entity {
            animation: bounce 1s infinite;
        }
        
        /* Game status messages */
        .game-status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .game-status-content {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
        }
        .game-status-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #333;
        }
        .destroyed-message {
            color: #f44336;
            font-weight: bold;
        }
        .winner-message {
            color: #4CAF50;
            font-weight: bold;
        }
        
        /* Current turn indicator */
        .current-turn-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #F7E5A7; /* Match controlPanel background */
            padding: 5px 10px; /* Adjusted padding */
            border-radius: 10px; /* Match controlPanel border-radius */
            font-size: 18px; /* Larger font for turn indicator */
            font-weight: bold;
            color: black;
            z-index: 1001;
            display: flex; /* Use flex for icon and text */
            align-items: center;
            gap: 5px; /* Gap between icon and text */
        }
        .current-turn-icon {
            width: 60px; /* Increased size of the flag icon */
            height: 60px; /* Increased size of the flag icon */
            background-image: none; /* Remove background-image */
            mask: url('ui-elements/flag.svg') no-repeat center / contain; /* Use SVG as mask */
            background-color: transparent; /* This will be overridden by JS for color */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* Мобильная адаптация */
        @media (max-width: 600px) {
            #balanceDisplay {
                top: 8px;
                left: 8px;
                padding: 4px 7px;
                border-radius: 10px;
                font-size: 1em;
                gap: 2px;
            }
            .balance-icon, .tree-icon, .stone-icon {
                width: 28px;
                height: 28px;
            }
            .balance-amount, .tree-amount, .stone-amount {
                font-size: 1em;
            }
            .current-turn-indicator {
                top: 8px;
                right: 8px;
                padding: 4px 7px;
                border-radius: 10px;
                font-size: 1em;
            }
            .current-turn-icon {
                width: 28px;
                height: 28px;
            }
            #controlPanel {
                bottom: 90px;
                padding: 4px;
                border-radius: 10px;
                gap: 4px;
                min-width: 0;
                max-width: 99vw;
            }
            .unit-button {
                width: 44px;
                height: 44px;
                border-radius: 7px;
            }
            .unit-price {
                font-size: 0.9em;
            }
            #actionButtonsPanel {
                bottom: 10px;
                padding: 4px 7px;
                border-radius: 10px;
                width: clamp(90px, 40vw, 160px);
                gap: 8px;
            }
            .action-button {
                width: 36px;
                height: 36px;
                border-radius: 7px;
            }
            #sessionInput {
                top: 8px;
                padding: 10px;
                border-radius: 8px;
            }
            #sessionInput input {
                width: 70vw;
                font-size: 1.1em;
                padding: 10px;
            }
            #sessionInput button {
                font-size: 1em;
                padding: 10px 14px;
            }
            .unit-buttons-container {
                gap: 6px;
                max-width: 99vw;
                padding-bottom: 2px;
            }
        }
        #actionButtonsPanel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 5px 10px;
            background-color: #F7E5A7;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-around;
            width: clamp(125px, 25vw, 200px);
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="sessionInput">
        <input type="text" id="sessionId" placeholder="Enter session UUID">
        <button onclick="connectToSession()">Connect</button>
    </div>
    <div id="balanceDisplay" style="flex-direction: column; align-items: flex-start; gap: 2px;">
        <div style="display: flex; align-items: center; gap: 5px;">
            <div class="balance-icon"></div>
            <span class="balance-amount"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
            <div class="stone-icon"></div>
            <span class="stone-amount"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
            <div class="tree-icon"></div>
            <span class="tree-amount"></span>
        </div>
    </div>
    <div id="container">
        <canvas id="hexCanvas"></canvas>
    </div>
    <div id="controlPanel">
        <div class="unit-buttons-container">
            <div class="unit-button-container">
                <button id="BIG_TOWER_Btn" class="unit-button" onclick="sendUnitMove('BIG_TOWER')" title="Big Tower"></button>
                <div class="unit-price" data-unit="BIG_TOWER"></div>
            </div>
            <div class="unit-button-container">
                <button id="TOWER_Btn" class="unit-button" onclick="sendUnitMove('TOWER')" title="Tower"></button>
                <div class="unit-price" data-unit="TOWER"></div>
            </div>
            <div class="unit-button-container">
                <button id="FACTORY_Btn" class="unit-button" onclick="sendUnitMove('FACTORY')" title="Factory"></button>
                <div class="unit-price" data-unit="FACTORY"></div>
            </div>
            <div class="unit-button-container">
                <button id="FOREST_FARM_Btn" class="unit-button" onclick="sendUnitMove('FOREST_FARM')" title="Forest Farm"></button>
                <div class="unit-price" data-unit="FOREST_FARM"></div>
            </div>
            <div class="unit-button-container">
                <button id="MINE_FARM_Btn" class="unit-button" onclick="sendUnitMove('MINE_FARM')" title="Mine Farm"></button>
                <div class="unit-price" data-unit="MINE_FARM"></div>
            </div>
            <div class="unit-button-container">
                <button id="UNIT_1_Btn" class="unit-button" onclick="sendUnitMove('UNIT_1')" title="Unit Level 1"></button>
                <div class="unit-price" data-unit="UNIT_1"></div>
            </div>
            <div class="unit-button-container">
                <button id="UNIT_2_Btn" class="unit-button" onclick="sendUnitMove('UNIT_2')" title="Unit Level 2"></button>
                <div class="unit-price" data-unit="UNIT_2"></div>
            </div>
            <div class="unit-button-container">
                <button id="UNIT_3_Btn" class="unit-button" onclick="sendUnitMove('UNIT_3')" title="Unit Level 3"></button>
                <div class="unit-price" data-unit="UNIT_3"></div>
            </div>
            <div class="unit-button-container">
                <button id="TANK_Btn" class="unit-button" onclick="sendUnitMove('TANK')" title="Tank"></button>
                <div class="unit-price" data-unit="TANK"></div>
            </div>
            <div class="unit-button-container drone-button-container" style="display: none;">
                <button id="DRONE_Btn" class="unit-button" onclick="sendUnitMove('DRONE')" title="Drone"></button>
                <div class="unit-price" data-unit="DRONE"></div>
            </div>
        </div>
    </div>

    <!-- New action buttons panel -->
    <div id="actionButtonsPanel">
        <button class="action-button" id="undoBtn" onclick="sendUndoMove()" title="Undo Move"></button>
        <button class="action-button" id="endTurnBtn" onclick="endTurn()" title="End Turn"></button>
    </div>

    <!-- Waiting for players overlay -->
    <div id="waitingOverlay" class="waiting-overlay" style="display: none;">
        <div class="waiting-content">
            <h2 class="waiting-title">Ждем подключения игроков</h2>
            <div class="waiting-info">
                Подключено: <span id="connectedPlayers" class="player-count">0</span> / <span id="totalPlayers" class="player-count">0</span>
            </div>
        </div>
    </div>

    <!-- Color selection panel -->
    <div id="colorSelectionPanel" class="color-selection-panel" style="display: none;">
        <h3 class="color-selection-title">Выберите цвет</h3>
        <div class="color-buttons">
            <!-- Color buttons will be created dynamically -->
        </div>
        <button id="joinButton" class="join-button" onclick="joinSession()" disabled>Присоединиться</button>
    </div>

    <!-- Game status overlay -->
    <div id="gameStatusOverlay" class="game-status-overlay" style="display: none;">
        <div class="game-status-content">
            <h2 id="gameStatusTitle" class="game-status-title"></h2>
        </div>
    </div>

    <!-- Current turn indicator -->
    <div id="currentTurnIndicator" class="current-turn-indicator">
        <div class="current-turn-icon"></div>
    </div>

<script>
    // --- Глобальные переменные для drag/click ---
    let mouseDown = false;
    let mouseMoved = false;
    // Backend host management
    let backendHost = window.location.hostname;
    
    // Initialize backend host from localStorage
    function initializeBackendHost() {
        const storedHost = localStorage.getItem('backendHost');
        if (!storedHost) {
            currentHost = window.location.hostname;
            localStorage.setItem('backendHost', currentHost);
            backendHost = currentHost;
        } else {
            backendHost = storedHost;
        }
    }
    
    // Get backend URL for API calls
    function getBackendUrl() {
        return `http://${backendHost}:8080`;
    }
    
    // Get WebSocket URL
    function getWebSocketUrl() {
        return `ws://${backendHost}:8080/ws`;
    }
    
    // Initialize backend host on page load
    initializeBackendHost();
    
    // WebSocket and STOMP client variables
    let stompClient = null;
    let sessionId = null;
    let hexData = {};
    let sendPath = null;
    let currentUser = null;
    let selectedColor = null;
    let isGameReady = false;

    // Canvas setup
    const canvas = document.getElementById('hexCanvas');
    const ctx = canvas.getContext('2d');

    // Configuration
    const config = {
        hexSize: 30,
        minHexSize: 10,
        maxHexSize: 60,
        showCoordinates: false,
        backgroundColor: '#F7E5A7',
        existingHexColor: '#cccccc',
        missingHexColor: '#4b8bde',
        gridColor: '#000000',
        selectedHexColor: '#ffff00',  // Color for selected hex highlight
        selectedHexBorderWidth: 3,     // Border width for selected hex
        // Grass pattern colors - different shades of green
        grassColors: [
            '#3CB371'
        ]
    };

    // Map state
    const state = {
        currentColor: null,
        currentPlayer: 0,
        selectedUnit: null,
        editMode: false,
        offsetX: 0,
        offsetY: 0,
        isDragging: false,
        lastMouseX: 0,
        lastMouseY: 0,
        scale: 1,
        minScale: 0.5,
        maxScale: 3,
        selectedHex: null,
        selectedTownHall: null,
        hasBouncingEntities: false
    };

    // Color mapping function
    function getColorFromName(colorName) {
        const colorMap = {
            'EMPTY': '#3CB371',  // серый
            'RED': '#ff0000',    // красный
            'BLUE': '#0000ff',   // синий
            'GREEN': '#00ff00',  // зеленый
            'YELLOW': '#ffff00', // желтый
            'PURPLE': '#800080', // фиолетовый
            'ORANGE': '#ffa500', // оранжевый
            'BLACK': '#000000',  // черный
            'WHITE': '#ffffff'   // белый
        };
        return colorMap[colorName] || config.existingHexColor;
    }

    // Function to get random grass color for pattern
    function getRandomGrassColor() {
        const randomIndex = Math.floor(Math.random() * config.grassColors.length);
        return config.grassColors[randomIndex];
    }

    // Function to get deterministic grass color based on hex coordinates
    function getGrassColorForHex(hex) {
        // Use hex coordinates to generate a consistent color
        const hash = Math.abs(hex.vector.x * 73856093 + hex.vector.y * 19349663 + hex.vector.z * 83492791);
        const index = hash % config.grassColors.length;
        return config.grassColors[index];
    }

    // Function to draw territory borders only on specific sides
    function drawTerritoryBorders(x, y, size, hex, hexData) {
        if (!hex.color || hex.color === 'EMPTY') return;

        // Порядок соседей для вашей системы!
        const neighbors = [
            { x: hex.vector.x,     y: hex.vector.y + 1, z: hex.vector.z - 1 }, // 0: top
            { x: hex.vector.x + 1, y: hex.vector.y,     z: hex.vector.z - 1 }, // 1: top-right
            { x: hex.vector.x + 1, y: hex.vector.y - 1, z: hex.vector.z },     // 2: bottom-right
            { x: hex.vector.x,     y: hex.vector.y - 1, z: hex.vector.z + 1 }, // 3: bottom
            { x: hex.vector.x - 1, y: hex.vector.y,     z: hex.vector.z + 1 }, // 4: bottom-left
            { x: hex.vector.x - 1, y: hex.vector.y + 1, z: hex.vector.z }      // 5: top-left
        ];

        const borderColor = getColorFromName(hex.color);
        const borderWidth = 3;
        ctx.lineWidth = borderWidth;
        ctx.strokeStyle = borderColor;
        ctx.lineCap = 'round';
        //console.log("Клетка : " + hex.vector.x + " " + hex.vector.y + " " + hex.vector.z)
        //console.log(hex)

        for (let i = 0; i < 6; i++) {
            const neighbor = neighbors[i];
            const neighborKey = `Vector3(x=${neighbor.x}, y=${neighbor.y}, z=${neighbor.z})`;
            const neighborHex = hexData.map[neighborKey];
            //console.log("Сосед : " + i)
            //console.log(neighbor)

            if (!neighborHex || neighborHex.color !== hex.color) {
                // ВАЖНО: используем pointy-topped углы!
                
                const angle1 = (2 * Math.PI / 6 * i) - (2 * Math.PI / 3);
                const angle2 = (2 * Math.PI / 6 * ((i + 1) % 6) ) - (2 * Math.PI / 3);
                //console.log("Рисую границу : " + i + " Углы " + angle1 + " , " + angle2)
                const x1 = x + (size * 0.95) * Math.cos(angle1);
                const y1 = y + (size * 0.95) * Math.sin(angle1);
                const x2 = x + (size * 0.95) * Math.cos(angle2);
                const y2 = y + (size * 0.95) * Math.sin(angle2);

                ctx.beginPath();
                // if (i == 0) {
                //     ctx.strokeStyle = "#ffffff";
                // } else if (i == 1) {
                //     ctx.strokeStyle = "#000000";
                // } else {
                //     ctx.strokeStyle = borderColor;
                // }
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }
    }

    // WebSocket connection functions
    function connectToSession() {
        const sessionInput = document.getElementById('sessionId');
        sessionId = sessionInput.value.trim();
        
        let sendTopic = "/topic/sessions.X.event.send"
        let destTopic = "/topic/sessions.X.event.fetch"
        let destPath = destTopic.replace("X", sessionId)
        sendPath = sendTopic.replace("X", sessionId)

        if (!sessionId) {
            alert('Please enter a session UUID');
            return;
        }

        if (stompClient && stompClient.connected) {
            sendGetSession()
        } else {
            const stompConfig = {
                brokerURL: getWebSocketUrl(),
                reconnectDelay: 200,
                onConnect: function (frame) {
                    sessionInput.classList.add('hidden');

                    const subscription = stompClient.subscribe(destPath, function (message) {
                        const payload = JSON.parse(message.body);
                        updateHexData(payload);
                        renderGrid();
                    });

                    sendGetSession();
                    state.selectedUnit = null;
                    updateUnitButtons();
                },
                onDisconnect: function() {
                    sessionInput.classList.remove('hidden');
                }
            };
            
            stompClient = new StompJs.Client(stompConfig);
            stompClient.activate();
        }
    }

    function onError(error) {
        console.error('WebSocket Error:', error);
    }

    function sendMessage(message) {
        stompClient.publish({
                destination: sendPath,
                body: JSON.stringify(message)
                
            });
    }

    function sendGetSession() {
        const message = {
            type: "GET_SESSION"
        };
        sendMessage(message);
    }

    function updateUnitPrices() {
        if (!state.selectedTownHall || !state.selectedTownHall.prices) return;
        const storage = state.selectedTownHall.storage || { gold: 0, tree: 0, stone: 0 };
        const prices = state.selectedTownHall.prices;
        Object.entries(prices).forEach(([unitType, price]) => {
            const priceElement = document.querySelector(`.unit-price[data-unit="${unitType}"]`);
            const button = document.getElementById(`${unitType}_Btn`);
            if (priceElement && button) {
                // Форматируем цену в столбик
                priceElement.innerHTML = `
                    <div style='display: flex; flex-direction: column; align-items: flex-start; gap: 2px;'>
                        <span style='color:#d4af37;'>🪙${price.gold||0}</span>
                        <span style='color:#888;'>🪨${price.stone||0}</span>
                        <span style='color:#228B22;'>🌲${price.tree||0}</span>
                    </div>`;
                // Проверяем хватает ли всех ресурсов
                const canAfford = (storage.gold || 0) >= (price.gold || 0) && (storage.tree || 0) >= (price.tree || 0) && (storage.stone || 0) >= (price.stone || 0);
                button.disabled = !canAfford;

    // Check player status and show appropriate UI
    function checkPlayerStatus() {
        if (!hexData.players) return;

        const players = hexData.players;
        const totalPlayers = Object.keys(players).length;
        const connectedPlayers = Object.values(players).filter(player => player.userId !== null).length;
        const hasUnconnectedPlayers = Object.values(players).some(player => player.userId === null);
        
        // Find the player number for the current user
        let currentPlayerNumber = null;
        let currentColor = null;
        Object.entries(players).forEach(([playerNumber, player]) => {
            if (player.userId === currentUser.id) {
                currentPlayerNumber = parseInt(playerNumber);
                currentColor = player.color
            }
        });
        
        // Update currentPlayer if found
        if (currentPlayerNumber !== null) {
            state.currentPlayer = currentPlayerNumber;
            state.currentColor = currentColor;
        }
        
        // Check if current user is already in the game
        const currentUserInGame = Object.values(players).some(player => player.userId === currentUser.id);

        // Update player count display
        document.getElementById('connectedPlayers').textContent = connectedPlayers;
        document.getElementById('totalPlayers').textContent = totalPlayers;

        if (hasUnconnectedPlayers || !currentUserInGame) {
            // Show waiting overlay or color selection
            showWaitingUI(currentUserInGame, hasUnconnectedPlayers);
            isGameReady = false;
        } else {
            // All players connected and current user is in game
            hideWaitingUI();
            isGameReady = true;
        }
    }

    // Check game status (winner, destroyed player)
    function checkGameStatus() {
        if (!hexData.players) return;

        const players = hexData.players;
        
        // Check if current player is destroyed
        if (state.currentPlayer !== null && players[state.currentPlayer]) {
            const currentPlayer = players[state.currentPlayer];
            if (currentPlayer.illuminated === true) {
                showDestroyedMessage();
                return;
            }
        }
        
        // Check if game has a winner
        if (hexData.winnerId !== null && hexData.winnerId !== undefined) {
            const winnerPlayer = Object.values(players).find(player => player.userId === hexData.winnerId);
            if (winnerPlayer) {
                showWinnerMessage(winnerPlayer.color);
                return;
            }
        }
        
        // If no special status, hide game status overlay
        hideGameStatusOverlay();
    }

        if (!selectedColor || !currentUser || !sessionId) {
            alert('Пожалуйста, выберите цвет');
            return;
        }

        try {
            const response = await fetch(`${getBackendUrl()}/api/sessions/join`, {
                method: 'POST',

                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    sessionId: sessionId,
                    userId: currentUser.id,
                    color: selectedColor

            });

    function cubeToPixel(cube) {
        const size = config.hexSize * state.scale;
        const x = size * (3/2) * cube.x;
        const y = size * (Math.sqrt(3)/2 * cube.x + Math.sqrt(3) * cube.z);
        return {
            x: (canvas.width / 2) + x + state.offsetX,
            y: (canvas.height / 2) + y + state.offsetY
        };
    }

    function renderGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = config.backgroundColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!hexData || typeof hexData.map !== 'object' || !hexData.map) return;

        const size = config.hexSize * state.scale;
        ctx.imageSmoothingEnabled = true; // Всегда включаем сглаживание для иконок

        const hexList = Object.values(hexData.map || {});
        if (!hexList.length) return;

        hexList.forEach(hex => {
            if (!hex || !hex.vector) return;
            const pixelPos = cubeToPixel(hex.vector);
            drawHexagonWithoutBorders(pixelPos.x, pixelPos.y, size, hex, hexData);
        });

        hexList.forEach(hex => {
            if (!hex || !hex.vector) return;
            const pixelPos = cubeToPixel(hex.vector);
            drawHexagonBorders(pixelPos.x, pixelPos.y, size, hex, hexData);
        });

        // Рисуем круговую диаграмму powerByColor
        if (powerByColor) {
            drawPowerPieChart(powerByColor);
        }
    }

    }

    }

    // Mouse event handlers
    function handleMouseDown(e) {
        
        
        state.isDragging = true;
        state.lastMouseX = e.clientX;
        state.lastMouseY = e.clientY;
        canvas.style.cursor = 'grabbing';
    }

    function handleMouseMove(e) {
        if (state.isDragging) {
            const dx = e.clientX - state.lastMouseX;
            const dy = e.clientY - state.lastMouseY;
            state.offsetX += dx;
            state.offsetY += dy;
            state.lastMouseX = e.clientX;
            state.lastMouseY = e.clientY;
            renderGrid();
        }
    }

    function handleMouseUp() {
        state.isDragging = false;
        canvas.style.cursor = 'grab';
    }

    function handleWheel(e) {
      
        
        e.preventDefault();

        const delta = e.deltaY > 0 ? -1 : 1;
        const scaleFactor = 1.1;

        const mouseX = e.clientX - canvas.offsetLeft;
        const mouseY = e.clientY - canvas.offsetTop;
        const worldX = (mouseX - canvas.width/2 - state.offsetX) / state.scale;
        const worldY = (mouseY - canvas.height/2 - state.offsetY) / state.scale;

        const newScale = delta > 0 ?
            Math.min(state.scale * scaleFactor, state.maxScale) :
            Math.max(state.scale / scaleFactor, state.minScale);

        if (newScale !== state.scale) {
            state.offsetX = mouseX - canvas.width/2 - worldX * newScale;
            state.offsetY = mouseY - canvas.height/2 - worldY * newScale;
            state.scale = newScale;
            renderGrid();
        }
    }

    // Function to convert pixel coordinates to cubic coordinates
    function pixelToCube(x, y) {
        const size = config.hexSize * state.scale;
        
        // Adjust coordinates for canvas center and offset
        const adjustedX = x - (canvas.width / 2) - state.offsetX;
        const adjustedY = y - (canvas.height / 2) - state.offsetY;
        
        // Convert to axial coordinates
        const q = (2/3) * adjustedX / size;
        const r = (-1/3) * adjustedX / size + (Math.sqrt(3)/3) * adjustedY / size;
        
        // Convert to cube coordinates
        let rx = Math.round(q);
        let ry = Math.round(-q - r);
        let rz = Math.round(r);
        
        // Round to nearest valid cube coordinates
        const xDiff = Math.abs(rx - q);
        const yDiff = Math.abs(ry - (-q - r));
        const zDiff = Math.abs(rz - r);
        
        if (xDiff > yDiff && xDiff > zDiff) {
            rx = -ry - rz;
        } else if (yDiff > zDiff) {
            ry = -rx - rz;
        } else {
            rz = -rx - ry;
        }
        
        return { x: rx, y: ry, z: rz };
    }

    // Function to log current state
    function logCurrentState() {
        console.log('Current State:', {
            currentPlayer: state.currentPlayer,
            selectedUnit: state.selectedUnit,
            editMode: state.editMode,
            selectedHex: state.selectedHex,
            selectedTownHall: state.selectedTownHall ? {
                type: state.selectedTownHall.type,
                level: state.selectedTownHall.level,
                balance: state.selectedTownHall.balance,
                balanceChanges: state.selectedTownHall.balanceChanges
            } : null,
            hexData: hexData ? {
                currentPlayerMove: hexData.currentPlayerMove,
                players: hexData.players ? Object.keys(hexData.players).length : 0,
                mapSize: hexData.map ? Object.keys(hexData.map).length : 0
            } : null
        });
    }

    // Click handler for canvas
    function handleCanvasClick(e) {
        if (state.isDragging || !isInteractionAllowed()) {
            return;
        }
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const cubicCoords = pixelToCube(x, y);
        const hexKey = `Vector3(x=${cubicCoords.x}, y=${cubicCoords.y}, z=${cubicCoords.z})`;
        const hex = hexData.map[hexKey];
        
        if (hex) {
            const pixelPos = cubeToPixel(hex.vector);
            const size = config.hexSize * state.scale;
            
            const dx = x - pixelPos.x;
            const dy = y - pixelPos.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const hexRadius = size;
            
            if (distance <= hexRadius) {
                if (hex.isAvailable !== false) {
                    onHexClick(cubicCoords);
                }
            }
        } else {
            sendClickBeforeMove(null, null);
            state.selectedHex = null
        }
    }

    // Function to handle hex click
    function onHexClick(cubicCoords) {
        console.log('onHexClick', cubicCoords);
        let move_sended = false;
        if (state.selectedUnit) {
            // If unit is selected, try to place it
            sendUnitMove(state.selectedUnit, cubicCoords);
            state.selectedUnit = null;
            updateUnitButtons();
        } else {
            const hexKey = `Vector3(x=${cubicCoords.x}, y=${cubicCoords.y}, z=${cubicCoords.z})`;
            const clickedHex = hexData.map[hexKey];

            if (state.selectedHex) {
                // If we already have a selected hex, try to move the unit
                const fromHexKey = `Vector3(x=${state.selectedHex.x}, y=${state.selectedHex.y}, z=${state.selectedHex.z})`;
                const fromHex = hexData.map[fromHexKey];

                if (fromHex && fromHex.entity && fromHex.entity.type) {
                    // Send move event if there's a unit in the selected hex
                    if (stompClient && stompClient.connected) {
                        const message = {
                            type: "MOVE",
                            move: {
                                redactorMode: state.editMode,
                                player: state.currentPlayer,
                                entityType: fromHex.entity.type,
                                to: {
                                    x: cubicCoords.x,
                                    y: cubicCoords.y,
                                    z: cubicCoords.z
                                },
                                from: {
                                    x: state.selectedHex.x,
                                    y: state.selectedHex.y,
                                    z: state.selectedHex.z
                                }
                            }
                        };
                        console.log('Sending move message:', message);
                        sendMessage(message);
                        move_sended = true;
                    }
                }
                // Clear selection after move attempt
                state.selectedHex = null;
            } else if (
                (
                    (clickedHex.color == state.currentColor && (!clickedHex.entity.ownerColor || clickedHex.entity.ownerColor == state.currentColor)) || clickedHex.entity.ownerColor == state.currentColor) 
                    && state.selectedHex == null
                ) {
                // Select the new hex
                state.selectedHex = cubicCoords;
            }
            
            renderGrid();
            if (!move_sended) {
                sendClickBeforeMove(clickedHex, null);
            }
        }
    }

    function sendClickBeforeMove(hex, entityType) {
        if (stompClient && stompClient.connected) {
            const message = {
                type: "BEFORE_MOVE",
                hex : hex,
                entityType: entityType,
                move: {
                    redactorMode : state.editMode,
                    player: state.currentPlayer
                }
            };
            sendMessage(message);
        }
    }

    // Function to send unit move (now only used for placing new units)
    function sendUnitMove(entityType, cubicCoords) {
        if (!isInteractionAllowed()) return;
        
        if (!cubicCoords) {
            // If no coordinates provided, this is unit selection
            state.selectedUnit = entityType;
            sendClickBeforeMove(null, entityType);
            updateUnitButtons();
            logCurrentState();
            return;
        }

        if (stompClient && stompClient.connected) {
            const message = {
                type: "MOVE",
                move: {
                    redactorMode: state.editMode,
                    player: state.currentPlayer,
                    entityType: entityType,
                    to: {
                        x: cubicCoords.x,
                        y: cubicCoords.y,
                        z: cubicCoords.z
                    }
                }
            };
            console.log('Sending move message:', message);
            sendMessage(message);
            state.selectedHex = null;
            renderGrid();
        }
    }

    // Update unit buttons state based on selection
    function updateUnitButtons() {
        const buttons = document.querySelectorAll('.unit-button');
        buttons.forEach(button => {
            const entityType = button.getAttribute('onclick').match(/'([^']+)'/)[1];
            button.classList.toggle('selected', state.selectedUnit === entityType);
            // Disable unit buttons if it's not the player's turn (or if unaffordable)
            if (!isInteractionAllowed()) {
                button.disabled = true;
            } else {
                // Проверяем хватает ли всех ресурсов
                const priceElement = document.querySelector(`.unit-price[data-unit="${entityType}"]`);
                if (priceElement) {
                    const price = state.selectedTownHall && state.selectedTownHall.prices ? state.selectedTownHall.prices[entityType] : null;
                    const storage = state.selectedTownHall && state.selectedTownHall.storage ? state.selectedTownHall.storage : { gold: 0, tree: 0, stone: 0 };
                    const canAfford = price && (storage.gold || 0) >= (price.gold || 0) && (storage.tree || 0) >= (price.tree || 0) && (storage.stone || 0) >= (price.stone || 0);
                    button.disabled = !canAfford;
                }
            }
        });
    }

    // Function to send undo move message
    function sendUndoMove() {
        if (!isInteractionAllowed()) return;
        
        if (stompClient && stompClient.connected) {
            const message = {
                type: "UNDO_MOVE"
            };
            console.log('Sending undo move message:', message);
            sendMessage(message);
        }
    }

    // Функция для обработки окончания хода
    function endTurn() {
        if (!isInteractionAllowed()) return;
        
        if (stompClient && stompClient.connected) {
            const message = {
                type: "FINISH_TURN",
                move: {
                    redactorMode: state.editMode,
                    player: state.currentPlayer
                }
            };
            console.log('Отправка события окончания хода:', message);
            sendMessage(message);
        }
    }

    // Keyboard event handler
    function handleKeyDown(e) {
        if (!isInteractionAllowed()) return;
        
        if (e.key === 'Escape') {
            state.selectedHex = null;
            sendClickBeforeMove(null, null);
        }
    }

    // Function to draw hexagon without borders
    function drawHexagonWithoutBorders(x, y, size, hex, hexData) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = 2 * Math.PI / 6 * i;
            const xi = x + size * Math.cos(angle);
            const yi = y + size * Math.sin(angle);
            if (i === 0) {
                ctx.moveTo(xi, yi);
            } else {
                ctx.lineTo(xi, yi);
            }
        }
        ctx.closePath();
        
        // Fill with grass pattern color
        grassColor = null
        if (state.selectedHex && isInteractionAllowed()) {
            grassColor = getColorFromName(hex.color)
        } else {
            grassColor = getGrassColorForHex(hex);
        }

        if (hex.isAvailable === false) {
            ctx.globalAlpha = 0.3;
        }
        ctx.fillStyle = grassColor;
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // Draw entity icon if present
        if (hex.entity && hex.entity.type) {
            const img = getEntityImage(hex.entity.type);
            if (img && img.complete) {
                let iconSize = size * 1;
                let yOffset = 0;
                if (hex.entity.type === 'FIRE') {
                    // Меняем размер в зависимости от stage
                    if (hex.entity.stage === 2) {
                        iconSize = size * 0.8;
                    } else if (hex.entity.stage === 1) {
                        iconSize = size * 0.6;
                    } else {
                        iconSize = size * 1;
                    }
                }
                // Если DRONE, рисуем кружок ownerColor
                if (hex.entity.type === 'DRONE' && hex.entity.ownerColor) {
                    const colorMap = {
                        'EMPTY': '#3CB371',
                        'RED': '#ff0000',
                        'BLUE': '#0000ff',
                        'GREEN': '#00ff00',
                        'YELLOW': '#ffff00',
                        'PURPLE': '#800080',
                        'ORANGE': '#ffa500',
                        'BLACK': '#000000',
                        'WHITE': '#ffffff'
                    };
                    ctx.beginPath();
                    ctx.arc(x, y - iconSize * 0.05, iconSize * 0.5, 0, 2 * Math.PI);
                    ctx.fillStyle = colorMap[hex.entity.ownerColor] || '#000';
                    ctx.globalAlpha = 0.85;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
                ctx.drawImage(img, 
                    x - iconSize/2, 
                    y - iconSize/2 + yOffset, 
                    iconSize, 
                    iconSize
                );
            }
        }

        // Draw shield icon if displayDefence is true
        if (hex.displayDefence) {
            const shieldImg = getEntityImage('SHIELD');
            if (shieldImg && shieldImg.complete) {
                const shieldSize = size * 1; // Shield is slightly smaller than entity
                ctx.drawImage(shieldImg,
                    x - shieldSize/2,
                    y - shieldSize/2,
                    shieldSize,
                    shieldSize
                );
                ctx.fillStyle = '#ffff00';
                ctx.font = `${Math.max(8, 10 * state.scale)}px Arial`;
                ctx.fillText(`${hex.defenseLevel}`,
                    x - shieldSize/10,
                    y + shieldSize/10);
                ctx.fillStyle = '#00FFFF';
            }
        }

        // Draw coordinates if enabled
        if (config.showCoordinates) {
            ctx.fillStyle = '#00FFFF';
            ctx.font = `${Math.max(8, 10 * state.scale)}px Arial`;
            ctx.fillText(`${hex.vector.x},${hex.vector.y},${hex.vector.z}`,
                        x - 20 * state.scale,
                        y + 5 * state.scale);
            ctx.fillText(`${hex.defenseLevel}`,
                        x - 15 * state.scale,
                        y + 15 * state.scale);
        }
    }

    // Function to draw hexagon borders only
    function drawHexagonBorders(x, y, size, hex, hexData) {
        // Check if this hex is selected
        const isSelected = state.selectedHex && 
            state.selectedHex.x === hex.vector.x && 
            state.selectedHex.y === hex.vector.y && 
            state.selectedHex.z === hex.vector.z;
        
        if (isSelected) {
            // Selected hex border - draw full border
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const xi = x + size * Math.cos(angle);
                const yi = y + size * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(xi, yi);
                } else {
                    ctx.lineTo(xi, yi);
                }
            }
            ctx.closePath();
            
            ctx.lineWidth = config.selectedHexBorderWidth;
            ctx.strokeStyle = config.selectedHexColor;
            ctx.stroke();
        } else if (hex.color && hex.color !== 'EMPTY') {
            // Territory border - draw only specific sides
            drawTerritoryBorders(x, y, size, hex, hexData);
        } else if (hex.isAvailable === false) {
            // Unavailable hex border
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const xi = x + size * Math.cos(angle);
                const yi = y + size * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(xi, yi);
                } else {
                    ctx.lineTo(xi, yi);
                }
            }
            ctx.closePath();
            
            ctx.lineWidth = 3; // Thicker border for unavailable areas
            ctx.strokeStyle = '#666666';
            ctx.stroke();
        }
    }

    // Initialize the application
    init();

    // Initialize unit buttons as disabled
    document.addEventListener('DOMContentLoaded', function() {
        updateUnitButtons();
    });

    // --- Жесты для мобильных устройств ---
    let lastTouchDistance = null;
    let lastTouchCenter = null;
    let isTouchDragging = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchMoved = false;
    let longTapTimeout = null;
    const LONG_TAP_DURATION = 500; // мс
    let wasTouch = false; // <--- для блокировки ghost click только после touch

    function getTouchDistance(touches) {
        if (touches.length < 2) return 0;
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }
    function getTouchCenter(touches) {
        if (touches.length < 2) return {x: 0, y: 0};
        return {
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2
        };
    }
    canvas.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            isTouchDragging = false;
            touchMoved = false;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            state.lastMouseX = touchStartX;
            state.lastMouseY = touchStartY;
            // long tap detection
            longTapTimeout = setTimeout(() => {
                state.selectedHex = null;
                sendClickBeforeMove(null, null);
            }, LONG_TAP_DURATION);
        } else if (e.touches.length === 2) {
            lastTouchDistance = getTouchDistance(e.touches);
            lastTouchCenter = getTouchCenter(e.touches);
        }
    }, { passive: false });
    canvas.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1 && !touchMoved) {
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                isTouchDragging = true;
                touchMoved = true;
                if (longTapTimeout) {
                    clearTimeout(longTapTimeout);
                    longTapTimeout = null;
                }
            }
        }
        if (e.touches.length === 1 && isTouchDragging) {
            const dx = e.touches[0].clientX - state.lastMouseX;
            const dy = e.touches[0].clientY - state.lastMouseY;
            state.offsetX += dx;
            state.offsetY += dy;
            state.lastMouseX = e.touches[0].clientX;
            state.lastMouseY = e.touches[0].clientY;
            renderGrid();
        } else if (e.touches.length === 2) {
            const newDistance = getTouchDistance(e.touches);
            const center = getTouchCenter(e.touches);
            if (lastTouchDistance) {
                const scaleChange = newDistance / lastTouchDistance;
                let newScale = state.scale * scaleChange;
                newScale = Math.max(state.minScale, Math.min(state.maxScale, newScale));
                // Центрируем относительно центра pinch
                const worldX = (center.x - canvas.width/2 - state.offsetX) / state.scale;
                const worldY = (center.y - canvas.height/2 - state.offsetY) / state.scale;
                state.offsetX = center.x - canvas.width/2 - worldX * newScale;
                state.offsetY = center.y - canvas.height/2 - worldY * newScale;
                state.scale = newScale;
                renderGrid();
            }
            lastTouchDistance = newDistance;
            lastTouchCenter = center;
        }
        e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchend', function(e) {
        // Обычный тап (если не было drag)
        if (!isTouchDragging && !touchMoved && e.changedTouches.length === 1) {
            handleCanvasClick({ clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY, preventDefault: ()=>{}, stopPropagation: ()=>{} });
            wasTouch = true;
            setTimeout(() => { wasTouch = false; }, 700);
            e.preventDefault(); // предотвращаем ghost click
        }
        if (longTapTimeout) {
            clearTimeout(longTapTimeout);
            longTapTimeout = null;
        }
        isTouchDragging = false;
        touchMoved = false;
        if (e.touches.length < 2) {
            lastTouchDistance = null;
            lastTouchCenter = null;
        }
        if (e.touches.length === 0) {
            isTouchDragging = false;
        }
    }, { passive: false });

    // --- Таймер ---
    let timerInterval = null;
    let lastEndMoveTime = null;
    let clockImg = new window.Image();
    clockImg.src = 'ui-elements/clock.svg';

    function getSecondsLeft(endMoveTime) {
        if (!endMoveTime) return null;
        const end = new Date(endMoveTime).getTime();
        const now = Date.now();
        return Math.max(0, Math.round((end - now) / 1000));
    }

    function startTimerUpdater() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (typeof renderGrid === 'function') renderGrid();
        }, 1000);
    }

    // Модифицируем drawPowerPieChart
    function drawPowerPieChart(powerObj) {
        const colors = Object.keys(powerObj);
        const values = Object.values(powerObj);
        const total = values.reduce((a, b) => a + b, 0);
        if (total === 0) return;
        const centerY = 40; // отступ сверху
        const radius = 40;
        // --- Центрирование двух элементов ---
        const gap = 20; // px между диаграммой и часами
        const totalWidth = radius * 2 + gap + radius * 2;
        const centerX = canvas.width / 2 - totalWidth / 2 + radius;
        const clockX = centerX + radius + gap + radius; // центр clock.svg

        // Размеры для таймера
        const clockRadius = radius * 0.7; // Уменьшаем размер часов
        const timerFontSize = 24; // Размер шрифта для секунд
        const clockY = centerY - timerFontSize/3; // Сдвигаем часы чуть выше

        let startAngle = -Math.PI / 2; // сверху
        // Цвета для секторов
        const colorMap = {
            'EMPTY': '#3CB371',
            'RED': '#ff0000',
            'BLUE': '#0000ff',
            'GREEN': '#00ff00',
            'YELLOW': '#ffff00',
            'PURPLE': '#800080',
            'ORANGE': '#ffa500',
            'BLACK': '#000000',
            'WHITE': '#ffffff'
        };
        colors.forEach((color, i) => {
            const value = powerObj[color];
            if (value <= 0) return;
            const percent = value / total;
            const endAngle = startAngle + percent * 2 * Math.PI;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = colorMap[color] || '#ccc';
            ctx.globalAlpha = 0.85;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            // --- подпись процента ---
            const midAngle = (startAngle + endAngle) / 2;
            const labelRadius = radius * 0.65;
            const labelX = centerX + labelRadius * Math.cos(midAngle);
            const labelY = centerY + labelRadius * Math.sin(midAngle) + 4;
            const percentText = Math.round(percent * 100) + '%';
            let textColor = '#fff';
            if (colorMap[color]) {
                const hex = colorMap[color].replace('#','');
                const r = parseInt(hex.substring(0,2),16);
                const g = parseInt(hex.substring(2,4),16);
                const b = parseInt(hex.substring(4,6),16);
                const brightness = (r*299 + g*587 + b*114) / 1000;
                if (brightness > 170) textColor = '#222';
            }
            ctx.font = 'bold 15px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = textColor;
            ctx.fillText(percentText, labelX, labelY);
            startAngle = endAngle;
        });
        // Белая обводка
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // --- CLOCK & TIMER ---
        // endMoveTime должен быть в hexData.endMoveTime
        if (typeof hexData !== 'undefined' && hexData.endMoveTime) {
            // Запускаем обновление таймера
            if (lastEndMoveTime !== hexData.endMoveTime) {
                lastEndMoveTime = hexData.endMoveTime;
                startTimerUpdater();
            }
            const secondsLeft = getSecondsLeft(hexData.endMoveTime);
            // Рисуем иконку часов
            if (clockImg.complete) {
                ctx.save();
                ctx.drawImage(clockImg, 
                    clockX - clockRadius, 
                    clockY - clockRadius, 
                    clockRadius * 2, 
                    clockRadius * 2
                );
                ctx.restore();
            } else {
                clockImg.onload = () => renderGrid();
            }
            // Рисуем секунды под иконкой
            ctx.save();
            ctx.font = `bold ${timerFontSize}px "Castlefire", Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = '#222';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            const timerText = secondsLeft + 's';
            const textY = clockY + clockRadius - timerFontSize/2;
            // Белая обводка для читаемости
            ctx.strokeText(timerText, clockX, textY);
            ctx.fillText(timerText, clockX, textY);
            ctx.restore();
        }
    }

    // --- ПК: обработка клика только через click ---
    canvas.addEventListener('click', function(e) {
        if (wasTouch) return; // предотвращаем ghost click после touch
        handleCanvasClick(e);
    });

    // --- Удаляем вызовы handleCanvasClick из mouseup и других mouse событий ---
    // (оставляем только drag-логику)
    //
    // Было:
    // canvas.addEventListener('mouseup', function(e) {
    //     ...
    //     handleCanvasClick(e); // <-- УДАЛИТЬ!
    // });
    //
    // Оставляем только drag-логику:
    canvas.addEventListener('mousedown', function(e) {
        mouseDown = true;
        mouseMoved = false;
        state.lastMouseX = e.clientX;
        state.lastMouseY = e.clientY;
        canvas.style.cursor = 'grabbing';
    });
    canvas.addEventListener('mousemove', function(e) {
        if (mouseDown) {
            const dx = e.clientX - state.lastMouseX;
            const dy = e.clientY - state.lastMouseY;
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                state.offsetX += dx;
                state.offsetY += dy;
                state.lastMouseX = e.clientX;
                state.lastMouseY = e.clientY;
                renderGrid();
                mouseMoved = true;
            }
        }
    });
    canvas.addEventListener('mouseup', function(e) {
        canvas.style.cursor = 'grab';
        mouseDown = false;
        mouseMoved = false;
    });
    canvas.addEventListener('mouseleave', function(e) {
        mouseDown = false;
        mouseMoved = false;
        canvas.style.cursor = 'grab';
    });
</script>

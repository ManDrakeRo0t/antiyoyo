<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>World Wars</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="game.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0-beta2/bundles/stomp.umd.min.js"></script>
</head>
<body>
    <div id="sessionInput">
        <input type="text" id="sessionId" placeholder="Enter session UUID">
        <div class="button-container">
            <button onclick="goBack()">
                <img class="button-bg" src="ui-elements/svg/red_button.svg" alt="Back" />
                <span class="button-text">BACK</span>
            </button>
            <button onclick="connectToSession()">
                <img class="button-bg" src="ui-elements/svg/blue_button.svg" alt="Connect" />
                <span class="button-text">CONNECT</span>
            </button>
        </div>
    </div>
    <div id="balanceDisplay" style="flex-direction: column; align-items: flex-start; gap: 2px;">
        <div style="display: flex; align-items: center; gap: 5px;">
            <div class="balance-icon"></div>
            <span class="balance-amount"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
            <div class="stone-icon"></div>
            <span class="stone-amount"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
            <div class="tree-icon"></div>
            <span class="tree-amount"></span>
        </div>
    </div>
    <div id="container">
        <canvas id="hexCanvas"></canvas>
        <div id="notificationContainer" class="notification-container"></div>
    </div>
    <div id="controlPanel">
        <div class="unit-buttons-container">
            <div class="unit-button-container">
                <button id="BIG_TOWER_Btn" class="unit-button" onclick="sendUnitMove('BIG_TOWER')" title="Big Tower"></button>
                <div class="unit-price" data-unit="BIG_TOWER"></div>
            </div>
            <div class="unit-button-container">
                <button id="TOWER_Btn" class="unit-button" onclick="sendUnitMove('TOWER')" title="Tower"></button>
                <div class="unit-price" data-unit="TOWER"></div>
            </div>
            <div class="unit-button-container">
                <button id="FACTORY_Btn" class="unit-button" onclick="sendUnitMove('FACTORY')" title="Factory"></button>
                <div class="unit-price" data-unit="FACTORY"></div>
            </div>
            <div class="unit-button-container">
                <button id="FOREST_FARM_Btn" class="unit-button" onclick="sendUnitMove('FOREST_FARM')" title="Forest Farm"></button>
                <div class="unit-price" data-unit="FOREST_FARM"></div>
            </div>
            <div class="unit-button-container">
                <button id="MINE_FARM_Btn" class="unit-button" onclick="sendUnitMove('MINE_FARM')" title="Mine Farm"></button>
                <div class="unit-price" data-unit="MINE_FARM"></div>
            </div>
            <div class="unit-button-container">
                <button id="UNIT_1_Btn" class="unit-button" onclick="sendUnitMove('UNIT_1')" title="Unit Level 1"></button>
                <div class="unit-price" data-unit="UNIT_1"></div>
            </div>
            <div class="unit-button-container">
                <button id="UNIT_2_Btn" class="unit-button" onclick="sendUnitMove('UNIT_2')" title="Unit Level 2"></button>
                <div class="unit-price" data-unit="UNIT_2"></div>
            </div>
            <div class="unit-button-container">
                <button id="UNIT_3_Btn" class="unit-button" onclick="sendUnitMove('UNIT_3')" title="Unit Level 3"></button>
                <div class="unit-price" data-unit="UNIT_3"></div>
            </div>
            <div class="unit-button-container">
                <button id="TANK_Btn" class="unit-button" onclick="sendUnitMove('TANK')" title="Tank"></button>
                <div class="unit-price" data-unit="TANK"></div>
            </div>
            <div class="unit-button-container drone-button-container" style="display: none;">
                <button id="DRONE_Btn" class="unit-button" onclick="sendUnitMove('DRONE')" title="Drone"></button>
                <div class="unit-price" data-unit="DRONE"></div>
            </div>
        </div>
    </div>

    <!-- New action buttons panel -->
    <div id="actionButtonsPanel">
        <button class="action-button" id="undoBtn" onclick="sendUndoMove()" title="Undo Move"></button>
        <button class="action-button" id="endTurnBtn" onclick="endTurn()" title="End Turn"></button>
    </div>

    <!-- Color & waiting panel (NEW) -->
    <div id="colorWaitingPanel" class="color-waiting-panel" style="display: none;">
        <div class="cw-title">Connection success!</div>
        <div class="cw-icons-row">
            <div class="cw-icon-block">
                <img src="ui-elements/svg/connected-users.svg" class="cw-icon" alt="Users" />
                <div class="cw-users-label">
                    <span id="cwConnectedPlayers">0</span> / <span id="cwTotalPlayers">0</span>
                </div>
            </div>
            <div class="cw-icon-block">
                <img src="ui-elements/svg/ranking.svg" class="cw-icon" alt="Ranking" />
                <div class="cw-ranking-label">Ranking</div>
            </div>
        </div>
        <div id="cwColorBlock" style="display: none;">
            <div class="cw-select-label">Select your color:</div>
            <div class="cw-color-circles"></div>
            <button id="cwSelectBtn" class="cw-select-btn" disabled>
                <img class="button-bg" src="ui-elements/svg/blue_button.svg" alt="Select" />
                <span class="button-text">SELECT</span>
            </button>
        </div>
    </div>
    <!-- Current turn indicator -->
    <div id="currentTurnIndicator" class="current-turn-indicator">
        <div class="current-turn-icon"></div>
    </div>
    <!-- Game status overlay -->
    <div id="gameStatusOverlay" class="game-status-overlay" style="display: none;">
        <div class="game-status-content">
            <h2 id="gameStatusTitle" class="game-status-title"></h2>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="auth.js"></script>
    <script src="game.js"></script>
</body>
</html>
